<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PreorderDesk</title>
<style>
/* v3: clean dashboard. Layout and color roles follow Mercury and Stripe (see UI-VALIDATION.md).
   Color roles: blue = what you can tap and things in motion; green = money in and things done;
   amber = your move; red = money missing; gray = waiting on someone else. */
:root{
  --bg:#ffffff; --side:#fafafa; --fill:#f5f5f7; --fill-2:#ececf0; --hover:#f7f7f9;
  --line:#e6e6eb; --line-2:#f0f0f3; --field:#d6d6db;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#a1a1a6;
  --blue:#0071e3; --blue-h:#0062c4; --blue-soft:#e9f2fd; --blue-t:#0058b0;
  --green:#1d7a3a; --green-soft:#e7f5eb;
  --amber:#965a00; --amber-soft:#fff1d6;
  --red:#c0312b; --red-soft:#fdecea;
  --gray-soft:#f0f0f2; --gray-t:#5d5d62;
  --ring:0 0 0 3px rgba(0,113,227,.18);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num,.tbl td,.kv,.big,.money-h,.amount{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .green{color:var(--green)} .red{color:var(--red)}
.label{display:block;font-size:13px;color:var(--ink-2);font-weight:500}

/* Shell (Mercury, Stripe): quiet sidebar, white canvas */
.sidebar{position:fixed;inset:0 auto 0 0;width:224px;background:var(--side);border-right:1px solid var(--line-2);padding:12px 10px 0;display:flex;flex-direction:column;gap:18px;z-index:20;overflow-y:auto}
.org{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;color:var(--ink);font-size:13px;font-weight:600;line-height:1.25}
.org:hover{background:var(--fill);text-decoration:none}
.org-av{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;flex:none}
.org small{display:block;font-weight:400;color:var(--ink-2);font-size:12px;line-height:1.25}
/* Rows: Mercury's 13px labels, gray icons, gray fill on the current page, plain counts */
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;min-height:30px;padding:0 8px;border-radius:7px;color:#424245;font-size:13px;line-height:1.45}
.nav a .ic{width:16px;height:16px;color:var(--ink-3)}
.nav a:hover{background:var(--fill);color:var(--ink);text-decoration:none}
.nav a.on{background:var(--fill-2);color:var(--ink);font-weight:500}
.nav a.on .ic{color:var(--ink)}
.nav .count{margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* Shortcuts with a status line (Mercury's Bookmarks) */
.side-h{font-size:12px;font-weight:500;color:var(--ink-3);padding:0 8px 4px}
.nav.bm a{align-items:flex-start;padding:5px 8px}
.nav.bm a .ic{margin-top:2px}
.nav.bm small{display:block;font-size:12px;font-weight:400;color:var(--ink-2);line-height:1.35}
/* Pinned last row (Stripe's Developers row) */
.side-foot{margin:auto -10px 0;border-top:1px solid var(--line-2);padding:12px 18px 14px;display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.4;color:var(--ink)}
.side-foot small{display:block;font-size:12px;color:var(--ink-3)}
.side-foot .link{margin-left:auto;font-size:12px}
.main-wrap{margin-left:224px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:15;height:60px;display:flex;align-items:center;gap:12px;padding:0 40px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px)}
.search{position:relative;flex:1;max-width:440px}
.search>.ic{position:absolute;left:12px;top:9px;color:var(--ink-3);width:18px;height:18px}
.search input{width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);padding:0 54px 0 38px;font-size:14px}
.search input:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 1px var(--blue),var(--ring)}
.search kbd{position:absolute;right:10px;top:8px;font:500 11px var(--f);color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:18px;background:#fff}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pop{position:absolute;left:0;right:0;top:44px;background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);padding:6px;max-height:460px;overflow:auto;z-index:50}
.pop h4{margin:10px 10px 4px;font-size:12px;font-weight:500;color:var(--ink-3)}
.pop a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink)}
.pop a .r{margin-left:auto}
.pop a:hover{background:var(--fill);text-decoration:none}
.pop .empty-s{padding:14px 10px;color:var(--ink-2)}
.page{max-width:1120px;margin:0 auto;padding:20px 40px 96px}

/* Headers */
.ph{display:flex;align-items:flex-start;gap:16px;margin:12px 0 28px;flex-wrap:wrap}
.ph h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.022em}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .sub{color:var(--ink-2);margin-top:4px}
.ph .who-h{display:flex;gap:16px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:2px;color:var(--ink-2);font-weight:500;font-size:13px;margin:8px 0 0 -4px}
.crumb .ic{width:16px;height:16px}
.crumb:hover{color:var(--ink);text-decoration:none}
.eyebrow{color:var(--ink-2);font-size:13px;font-weight:500;margin-bottom:2px}
.money-h{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.026em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.money-h .pill{letter-spacing:0}
.hello-date{color:var(--ink-2);margin-top:16px}
.hello{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.024em;margin-top:2px}

/* Buttons: pill shapes; one blue action per screen (Mercury) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border:0;border-radius:999px;background:var(--fill);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--fill-2);text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-h)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn.full{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;pointer-events:none}
.btn .ic{width:16px;height:16px}
.icon-btn{width:34px;height:34px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--ink-2);padding:0;flex:none}
.icon-btn:hover{background:var(--fill);color:var(--ink)}
.icon-btn .ic{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:500;cursor:pointer;font-size:inherit}
.link:hover{text-decoration:underline}
.link.muted{color:var(--ink-2)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}

/* Status pills (Stripe tones, used only where they carry meaning) */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;line-height:22px;white-space:nowrap;background:var(--gray-soft);color:var(--gray-t);vertical-align:middle}
.pill .ic{width:12px;height:12px;stroke-width:2.4}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue-t)}

/* Overview panel (Mercury balance card) */
.panel{border:1px solid var(--line);border-radius:16px;padding:24px 28px}
.overview{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:28px;align-items:center;margin:0 0 44px}
.big{font-size:40px;line-height:46px;font-weight:600;letter-spacing:-.03em;margin:4px 0 2px}
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line)}
.ov-stats.three{grid-template-columns:repeat(3,1fr)}
.ov-stats>*{padding:4px 22px;color:var(--ink);display:block}
.ov-stats>*+*{border-left:1px solid var(--line-2)}
.ov-stats a:hover{text-decoration:none}
.ov-stats a:hover strong{text-decoration:underline}
.ov-stats strong{display:block;font-size:20px;line-height:28px;font-weight:600;margin-top:4px;letter-spacing:-.012em;font-variant-numeric:tabular-nums}

/* Sections (Stripe): heading, hairline, content. No boxes. */
.sec{margin:0 0 48px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px;border-bottom:1px solid var(--line);margin:0 0 4px;min-height:42px}
.sec-h h2{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.012em;display:flex;align-items:center;gap:8px}
.sec-h .acts{display:flex;gap:8px;align-items:center}
.sec-h .n{color:var(--ink-3);font-weight:400}

/* To do (Jobber) */
.todo{list-style:none;margin:0;padding:0}
.todo li+li{border-top:1px solid var(--line-2)}
.todo a{display:grid;grid-template-columns:36px minmax(0,1fr) 18px;gap:14px;align-items:center;padding:14px 8px;margin:0 -8px;color:var(--ink);border-radius:12px}
.todo a:hover{background:var(--hover);text-decoration:none}
.ti{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-2)}
.ti.amber{background:var(--amber-soft);color:var(--amber)} .ti.green{background:var(--green-soft);color:var(--green)}
.ti.red{background:var(--red-soft);color:var(--red)} .ti.blue{background:var(--blue-soft);color:var(--blue)}
.todo strong{display:block;font-weight:500}
.todo small{display:block;color:var(--ink-2);font-size:13px;margin-top:1px}
.chev{color:var(--ink-3)}
.empty{padding:44px 0;text-align:center;color:var(--ink-2)}
.empty .ic{width:28px;height:28px;color:var(--green)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin:8px 0 2px}

/* Tabs (Stripe underline) and list toolbar */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 0;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink);text-decoration:none}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{color:var(--ink-3);margin-left:6px;font-weight:400}
.toolbar{display:flex;gap:8px;margin:0 0 8px}
.search-in{position:relative;flex:1;max-width:360px}
.search-in.full{max-width:none;margin:0 0 8px}
.search-in .ic{position:absolute;left:12px;top:10px;width:16px;height:16px;color:var(--ink-3)}
.search-in input{width:100%;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 36px;background:#fff}
.search-in input:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}

/* Tables (Mercury transactions, Stripe lists) */
.tbl-wrap{overflow-x:auto;margin:0 -12px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr[data-href]{cursor:pointer}
.tbl tr[data-href]:hover td,.tbl tr[data-act]:hover td{background:var(--hover)}
.tbl .who{display:flex;align-items:center;gap:12px}
.tbl .strong{font-weight:500;color:var(--ink)}
.tbl a.strong:hover{text-decoration:none}
.tbl small{display:block;color:var(--ink-2);font-size:12px;line-height:1.35}
.tbl-empty{padding:32px 0;color:var(--ink-2);text-align:center}
.rowlist{display:none;list-style:none;margin:0;padding:0}
.rowlist li+li{border-top:1px solid var(--line-2)}
.rowlist a{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;color:var(--ink)}
.rowlist a:hover{text-decoration:none}
.rowlist strong{display:block;font-weight:500}
.rowlist small{display:block;color:var(--ink-2);font-size:13px}
.rowlist .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Avatars and product photos */
.av{width:28px;height:28px;border-radius:50%;background:var(--fill-2);color:var(--ink-2);display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.av.md{width:36px;height:36px;font-size:13px}
.av.lg{width:56px;height:56px;font-size:19px}
.av.xl{width:72px;height:72px;font-size:24px}
.av .ic{width:55%;height:55%}
.thumb{width:40px;height:40px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--ink-3);flex:none;object-fit:cover}
.thumb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.thumb.sm{width:32px;height:32px;border-radius:8px} .thumb.sm svg{width:18px;height:18px}
.thumb.lg{width:72px;height:72px;border-radius:14px} .thumb.lg svg{width:32px;height:32px}
img.thumb{display:block}

/* Detail pages (Stripe payment page): main sections, details column, timeline */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-areas:"main side" "tl side";grid-template-rows:auto 1fr;gap:0 56px;align-items:start}
.d-main{grid-area:main;min-width:0} .d-side{grid-area:side;min-width:0} .d-tl{grid-area:tl;min-width:0}
.d-side .sec-h h2{font-size:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px 0}
.kv>span:nth-child(odd){color:var(--ink-2)}
.kv>span:nth-child(even){text-align:right}
.kv .tot{color:var(--ink)!important;font-weight:600}
.kv small{display:block;color:var(--ink-3);font-size:12px}
.kv+.kv{border-top:1px solid var(--line-2)}
.facts{list-style:none;margin:0;padding:0}
.facts li{padding:14px 0;border-bottom:1px solid var(--line-2)}
.facts li:last-child{border-bottom:0}
.fh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:4px}
.fh .link{font-size:13px}
.facts p{color:var(--ink)}
.facts p.muted{color:var(--ink-2)}
.group{padding:16px 0 6px}
.group+.group{border-top:1px solid var(--line-2)}
.group-h{display:flex;align-items:center;gap:10px;margin:0 0 4px;flex-wrap:wrap;min-height:30px}
.group-h .muted{font-size:13px}
.group-h .acts{margin-left:auto;display:flex;gap:8px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto 100px;gap:14px;align-items:center;padding:10px 0}
.line .thumb{width:44px;height:44px}
.ln{font-weight:500}
.ls{color:var(--ink-2);font-size:13px}
.lq{color:var(--ink-2);font-size:13px;white-space:nowrap}
.lt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.reasons{list-style:none;margin:2px 0 6px;padding:0}
.reasons li{display:flex;gap:10px;align-items:baseline;padding:3px 0;color:var(--ink-2);font-size:13px}
.reasons li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none;transform:translateY(-1px)}
.reasons li span{flex:1}
.reasons li .link,.reasons li a{font-size:13px;white-space:nowrap}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.plist li:last-child{border-bottom:0}
.plist .d{color:var(--ink-2);font-size:13px}
.plist .a{font-weight:500;color:var(--green);font-variant-numeric:tabular-nums}
.plist .a.due{color:var(--ink)}
.plist small{display:block;color:var(--ink-2);font-size:12px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:14px;background:var(--amber-soft);margin:0 0 36px}
.banner>.ic{color:var(--amber);margin-top:1px}
.banner strong{display:block;font-weight:600}
.banner p{color:#6b4a14}
.banner .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Timeline (Stripe) */
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{position:relative;padding:0 0 18px 26px}
.tl li::before{content:"";position:absolute;left:5px;top:7px;width:9px;height:9px;border-radius:50%;background:#c7c7cc}
.tl li::after{content:"";position:absolute;left:9px;top:20px;bottom:2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.note::before{background:var(--blue)}
.tl li.note span{display:inline-block;background:var(--fill);border-radius:10px;padding:6px 10px}
.tl small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.note-box{margin:14px 0 4px;padding:12px;border:1px solid var(--line);border-radius:12px}
.note-box textarea{width:100%;border:0;outline:none;resize:vertical;min-height:64px;font-size:14px}
.note-box .acts{display:flex;justify-content:flex-end;gap:8px}

/* Menus */
.menu{position:relative}
.menu-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:230px;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.13),0 0 0 1px rgba(0,0,0,.05);padding:6px}
.menu.open .menu-pop{display:block}
.menu-pop a,.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--ink);text-align:left;font-weight:400;font-size:14px}
.menu-pop a:hover,.menu-pop button:hover{background:var(--fill);text-decoration:none}
.menu-pop .ic{width:16px;height:16px;color:var(--ink-2)}
.menu-pop hr{border:0;border-top:1px solid var(--line-2);margin:6px 4px}

/* Forms (Apple-style fields and segmented control) */
.field{margin:0 0 16px;min-width:0}
.field>label,.field>.label{display:block;margin:0 0 6px;font-weight:500;font-size:13px;color:var(--ink)}
.req,.opt-l{color:var(--ink-3);font-weight:400}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]),.field select,.field textarea{width:100%;height:40px;border:1px solid var(--field);border-radius:10px;padding:0 12px;background:#fff;font-size:14px}
.field textarea{height:auto;min-height:150px;padding:10px 12px;line-height:1.5;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8e8e93 50%),linear-gradient(135deg,#8e8e93 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.input-pre,.input-post{display:flex;align-items:center;height:40px;border:1px solid var(--field);border-radius:10px;background:#fff;overflow:hidden}
.input-pre>span{color:var(--ink-2);padding:0 0 0 12px;white-space:nowrap}
.input-post>span{color:var(--ink-2);padding:0 12px 0 0}
.field .input-pre input,.field .input-post input,.input-pre input{flex:1;min-width:0;border:0!important;height:38px!important;box-shadow:none!important;padding:0 12px 0 6px!important;background:none!important;outline:none}
.field .input-post input{padding:0 6px 0 12px!important}
.input-pre:focus-within,.input-post:focus-within{border-color:var(--blue);box-shadow:var(--ring)}
.help{color:var(--ink-2);font-size:13px;margin-top:6px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.err .link{font-size:13px}

<script>
"use strict";
/* ---------- Helpers ---------- */
const KEY = 'preorderdesk-v3';
const DAY = 864e5;
const T0 = (() => { const t = new Date(); t.setHours(0, 0, 0, 0); return t.getTime(); })();
const iso = ms => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const rel = n => iso(T0 + n * DAY);
const TODAY = rel(0);
const toMs = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const dayDiff = s => Math.round((toMs(s) - T0) / DAY);
const fmt = s => s ? new Date(toMs(s)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
const fmtY = s => s ? new Date(toMs(s)).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtMY = s => s ? new Date(toMs(s)).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : '';
const ago = s => { const n = -dayDiff(s); return n === 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`; };
const naira = n => (n < 0 ? '−' : '') + '₦' + Math.abs(Math.round(n)).toLocaleString('en-NG');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const first = name => String(name).trim().split(/\s+/)[0];
const initials = name => String(name).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const digits = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
const digitStr = s => String(s || '').replace(/\D/g, '');
const ceil100 = n => Math.ceil(n / 100) * 100;
const payWord = m => m === 'Paystack' ? 'Paystack' : m.toLowerCase();

const I = {

const batchUnits = b => sum(ordersIn(b).flatMap(o => o.items.filter(i => i.batchId === b.id).map(i => i.qty)));
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  return 'New batch';
}

const fmtPhone = d => `+234 ${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6)}`.trim();
const BATCH_PILL = { open: ['Taking orders', 'blue'], transit: ['In transit', 'blue'], received: ['Received', 'green'], closed: ['Closed', ''] };
const batchPill = b => pill(...BATCH_PILL[b.status]);
function batchWhen(b) {
  if (b.status === 'open') return `taking orders until ${fmt(b.closesOn)}`;
  if (b.status === 'transit') return `in transit, expected ${fmt(b.eta)}`;
  return `received ${fmt(b.receivedOn)}`;
}

/* The one place that decides payment and fulfillment status for an order. */
function calc(o) {
  const items = o.items.map(it => {
    const b = batchById(it.batchId), p = P(it.sku);
    const here = it.handedOver || ['received', 'closed'].includes(b.status);
    const kg = p.kg * it.qty;
    const ship = it.shipIncluded ? 0 : (b.ratePerKg != null ? Math.round(kg * b.ratePerKg / 100) * 100 : null);
    return { ...it, b, p, here, kg, ship };
  });
  const goods = sum(items.map(i => i.price * i.qty));
  const shipKnown = items.every(i => i.ship !== null);
  const ship = sum(items.map(i => i.ship || 0));
  const delivery = o.delivery ? o.delivery.fee : 0;
  const total = goods + ship + delivery;
  const paid = sum(o.payments.map(p => p.amount));
  const owed = total - paid;
  const final = shipKnown && !!o.delivery;
  const claim = o.claims[0] || null;
  const remaining = items.filter(i => !i.handedOver);
  const missing = remaining.filter(i => !i.here);
  const reasons = [];
  if (remaining.length) {
    if (claim) reasons.push({ key: 'claim', text: `Payment pending: ${naira(claim.amount)} transfer to confirm` });
    if (missing.length) reasons.push({ key: 'items', text: `Waiting for items: ${andList(missing.map(i => `${i.p.name} (${i.b.name}, ${batchWhen(i.b)})`))}` });
    else if (!shipKnown) reasons.push({ key: 'freight', text: `Freight cost not added for the ${items.find(i => i.ship === null).b.name}` });
    else if (!o.delivery) reasons.push({ key: 'delivery', text: 'Delivery method not chosen' });
    if (!missing.length && shipKnown && owed > 0 && !claim) reasons.push({ key: 'payment', text: `Awaiting payment: ${naira(owed)} balance` });
  }
  const ready = remaining.length > 0 && reasons.length === 0;
  const fulfillable = ready ? remaining : remaining.filter(i => i.released && i.here);
  const held = remaining.filter(i => !fulfillable.includes(i));
  const delivered = remaining.length === 0;
  let pay;
  if (claim) pay = ['Payment pending', 'amber'];
  else if (paid <= 0) pay = ['Unpaid', 'red'];
  else if (owed > 0 || !final) pay = ['Partially paid', ''];
  else pay = ['Paid', 'green', 'check'];
  let ful;
  if (delivered) ful = ['Fulfilled', 'green', 'check'];
  else if (items.some(i => i.handedOver)) ful = ['Partially fulfilled', 'amber'];
  else if (fulfillable.length) ful = ['Ready to fulfill', 'amber'];
  else ful = ['On hold', ''];
  return { items, goods, ship, shipKnown, delivery, total, paid, owed, final, claim, remaining, missing, reasons, ready, fulfillable, held, delivered, pay, ful };
}
const payPill = c => pill(...c.pay);
const fulPill = c => pill(...c.ful);
const itemCount = o => sum(o.items.map(i => i.qty));

  const T = [];

  const ready = all.filter(x => x.c.ready);
  if (ready.length) T.push({ icon: 'box', tone: 'green', href: '#orders?tab=ready', title: `${plural(ready.length, 'order')} ready to fulfill`, sub: andList(ready.map(x => esc(x.cu.name))) });
  S.batches.filter(b => b.status === 'received' && b.ratePerKg == null).forEach(b => T.push({ icon: 'money', tone: 'amber', href: `#batch/${b.id}`, title: `Add freight cost for the ${b.name}`, sub: `Received ${ago(b.receivedOn)}. ${plural(ordersIn(b).length, 'customer')} are waiting for their final balance.` }));
  S.batches.filter(b => b.status === 'transit' && dayDiff(b.eta) <= 1).forEach(b => T.push({ icon: 'ship', tone: 'blue', href: `#batch/${b.id}`, title: `Receive the ${b.name}`, sub: `Expected ${fmt(b.eta)}.` }));
  all.filter(x => !x.c.claim && x.c.final && x.c.owed > 0 && !x.c.delivered && (!x.o.remindedOn || dayDiff(x.o.remindedOn) <= -3)).forEach(({ o, c, cu }) => T.push({ icon: 'chat', tone: 'red', href: `#order/${o.id}`, title: `${esc(cu.name)} has a ${naira(c.owed)} balance`, sub: o.remindedOn ? `Last reminder sent ${ago(o.remindedOn)}.` : 'No reminder sent yet.' }));
  const noMethod = all.filter(x => x.c.reasons.some(r => r.key === 'delivery') && x.o.remindedOn && dayDiff(x.o.remindedOn) <= -2);
  if (noMethod.length) T.push({ icon: 'truck', tone: 'amber', href: '#orders?tab=hold', title: `${plural(noMethod.length, 'customer')} haven’t chosen a delivery method`, sub: andList(noMethod.map(x => esc(x.cu.name))) });
  openBatches().filter(b => dayDiff(b.closesOn) <= 7).forEach(b => {
    const os = ordersIn(b);
    T.push({ icon: 'calendar', tone: 'blue', href: `#batch/${b.id}`, title: dayDiff(b.closesOn) <= 0 ? `The ${b.name} closes today` : `The ${b.name} closes ${dayDiff(b.closesOn) === 1 ? 'tomorrow' : `in ${dayDiff(b.closesOn)} days`}`, sub: `${plural(os.length, 'order')}, ${naira(sum(os.map(o => calc(o).paid)))} in deposits. Mark it as in transit once you order from the supplier.` });
  });
  if (!openBatches().length) T.push({ icon: 'batches', tone: 'blue', href: '#batches/new', title: 'No batch is taking orders', sub: 'Create a batch so customers can keep preordering.' });
  return T;
}

/* ---------- Pages ---------- */
function homePage() {
  const h = new Date().getHours();
  const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const all = S.orders.map(o => ({ o, c: calc(o) }));
  const dueOrders = all.filter(x => !x.c.delivered && x.c.owed > 0);
  const due = sum(dueOrders.map(x => x.c.owed));
  const ready = all.filter(x => x.c.ready).length;
  const hold = all.filter(x => !x.c.delivered && !x.c.fulfillable.length).length;
  const transit = S.batches.filter(b => b.status === 'transit');
  const inflow = sum(S.orders.flatMap(o => o.payments.filter(p => dayDiff(p.date) >= -30).map(p => p.amount)));
  const T = todos();
  return `<div class="page">
    <p class="hello-date">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <h1 class="hello">${greet}, ${STORE.owner}</h1>
    <div class="quick">
      <a class="btn primary" href="#orders/new">${ic('plus')}New order</a>
      <a class="btn" href="#batches/new">${ic('batches')}New batch</a>
      <button class="btn" data-act="add-product">${ic('box')}Add product</button>
      <button class="btn" data-act="add-customer">${ic('customers')}Add customer</button>
    </div>
    <section class="panel overview">
      <div><span class="label">Balance due</span><div class="big">${naira(due)}</div><span class="muted">Across ${plural(dueOrders.length, 'order')}</span></div>
      <div class="ov-stats">
        <a href="#orders?tab=ready"><span class="label">Ready to fulfill</span><strong>${ready}</strong></a>
        <a href="#orders?tab=hold"><span class="label">On hold</span><strong>${hold}</strong></a>
        <a href="#batches"><span class="label">In transit</span><strong>${plural(sum(transit.map(batchUnits)), 'unit')}</strong></a>
        <a href="#orders" title="Payments received in the last 30 days"><span class="label">Money in</span><strong class="green">${naira(inflow)}</strong></a>
      </div>
    </section>
    <section class="sec">
      <div class="sec-h"><h2>To do ${T.length ? `<span class="n">${T.length}</span>` : ''}</h2></div>
      ${T.length ? `<ul class="todo">${T.map(t => `<li><a href="${t.href}"><span class="ti ${t.tone}">${ic(t.icon)}</span><span><strong>${t.title}</strong><small>${t.sub}</small></span><span class="chev">${ic('chevR')}</span></a></li>`).join('')}</ul>`
        : `<div class="empty">${ic('done')}<strong>Nice! There’s nothing you need to do right now.</strong>New tasks appear here when a batch arrives or a customer pays.</div>`}
    </section>
  </div>`;
}

const TABS = [['all', 'All'], ['unpaid', 'Unpaid'], ['ready', 'Ready to fulfill'], ['hold', 'On hold'], ['fulfilled', 'Fulfilled']];
const TAB_TEST = {
  all: () => true,
  unpaid: c => !c.delivered && (c.owed > 0 || !!c.claim),
  ready: c => c.fulfillable.length > 0,
  hold: c => !c.delivered && c.fulfillable.length === 0,
  fulfilled: c => c.delivered,
};
let orderQuery = '';
function matchCust(cu, q) {
  const n = String(q || '').toLowerCase().trim(), d = digitStr(q);
  return !n || cu.name.toLowerCase().includes(n) || (d.length >= 3 && digitStr(cu.phone).includes(d));
}
function matchOrder(o, q) {
  if (!q) return true;
  const n = q.toLowerCase().replace('#', '').trim();
  return o.id.includes(n) || matchCust(custOf(o), q);
}
const batchNames = o => [...new Set(o.items.map(i => batchById(i.batchId).name))].join(', ');
function ordersPage(tab) {
  tab = TAB_TEST[tab] ? tab : 'all';
  const all = S.orders.map(o => ({ o, c: calc(o) }));
  return `<div class="page">
    <div class="ph"><h1>Orders</h1><div class="acts"><a class="btn primary" href="#orders/new">${ic('plus')}New order</a></div></div>
    <nav class="tabs" aria-label="Order views">${TABS.map(([k, l]) => `<a href="#orders?tab=${k}" class="${k === tab ? 'on' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${l}<span class="n">${all.filter(x => TAB_TEST[k](x.c)).length}</span></a>`).join('')}</nav>
    <div class="toolbar"><div class="search-in">${ic('search')}<input id="oq" type="search" placeholder="Search by order number, customer or phone" value="${esc(orderQuery)}" aria-label="Search orders"></div></div>
    <div id="orows" data-tab="${tab}">${orderRows(tab)}</div>
  </div>`;
}
function orderTable(rows) {
  return `<div class="tbl-wrap listify"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th>Batch</th><th>Payment</th><th>Fulfillment</th><th class="r">Total</th></tr></thead><tbody>
    ${rows.map(({ o, c, cu }) => `<tr data-href="#order/${o.id}"><td><a class="strong" href="#order/${o.id}" style="color:inherit">#${o.id}</a><small>${fmt(o.created)}</small></td><td><span class="who">${av(cu.name)}<span>${esc(cu.name)}</span></span></td><td class="muted">${esc(batchNames(o))}</td><td>${payPill(c)}</td><td>${fulPill(c)}</td><td class="r">${naira(c.total)}</td></tr>`).join('')}
  </tbody></table></div>
  <ul class="rowlist">${rows.map(({ o, c, cu }) => `<li><a href="#order/${o.id}">${av(cu.name, 'md')}<span><strong>${esc(cu.name)}</strong><small>#${o.id}, ${fmt(o.created)}</small></span><span class="r"><span class="num">${naira(c.total)}</span>${c.claim ? payPill(c) : c.fulfillable.length || c.delivered ? fulPill(c) : payPill(c)}</span></a></li>`).join('')}</ul>`;
}
function orderRows(tab) {
  const rows = S.orders.map(o => ({ o, c: calc(o), cu: custOf(o) })).filter(x => TAB_TEST[tab](x.c) && matchOrder(x.o, orderQuery));
  if (!rows.length) return `<div class="tbl-empty">No orders found. Try another view or search.</div>`;
  return orderTable(rows);
}

function lineRow(i) {
  let where;
  if (i.handedOver) where = '';
  else if (i.here) where = `Shelf ${i.shelf || 'not set'}`;
  else if (i.b.status === 'open') where = `${i.b.name}, taking orders until ${fmt(i.b.closesOn)}`;
  else where = `${i.b.name}, expected ${fmt(i.b.eta)}`;
  return `<div class="line">${thumb(i.p)}<div><div class="ln">${esc(i.p.name)}</div><div class="ls">${[esc(i.p.variant), where].filter(Boolean).join('. ')}</div></div><div class="lq">${naira(i.price)} × ${i.qty}</div><div class="lt">${naira(i.price * i.qty)}</div></div>`;
}
function methodText(o, cu) {
  if (!o.delivery) return 'Delivery method not chosen';
  return o.delivery.method === 'pickup' ? `Pickup at ${STORE.hub}` : `Delivery to ${esc(placeOf(cu.area))}`;
}
function reasonAction(r, o) {
  switch (r.key) {
    case 'payment': return `<button class="link" data-act="mark-paid" data-id="${o.id}">Mark as paid</button>`;
    case 'delivery': return `<button class="link" data-act="delivery" data-id="${o.id}">Choose delivery method</button>`;
    case 'freight': { const b = calc(o).items.find(i => i.ship === null).b; return `<a href="#batch/${b.id}">Add freight cost</a>`; }
    default: return '';
  }
}
function orderPage(id) {
  const o = orderById(id);
  if (!o) return `<div class="page"><div class="empty"><strong>This order doesn’t exist.</strong><a href="#orders">Back to orders</a></div></div>`;
  const c = calc(o), cu = custOf(o);
  const pickup = o.delivery && o.delivery.method === 'pickup';
  const fulfilledItems = c.items.filter(i => i.handedOver);
  const canRelease = c.held.some(i => i.here) && c.missing.length > 0;
  /* One blue action per page: confirm the transfer, else fulfill, else take payment. */
  const primary = c.claim ? 'claim' : c.fulfillable.length ? 'fulfill' : (!c.delivered && c.owed > 0) ? 'pay' : '';
  const shipRow = c.items.every(i => i.shipIncluded) ? ['Included in price', '₦0']
    : !c.shipKnown ? ['By weight, once the freight cost is added', '<span class="faint">Pending</span>']
    : [`By weight, ${sum(c.items.filter(i => !i.shipIncluded).map(i => i.kg))} kg`, naira(c.ship)];
  const delRow = !o.delivery ? ['Not chosen yet', '<span class="faint">Pending</span>'] : pickup ? [`Pickup at ${STORE.hub}`, '₦0'] : [`To ${esc(placeOf(cu.area))}`, naira(o.delivery.fee)];
  const batches = [...new Set(o.items.map(i => i.batchId))].map(batchById);
  const custOrders = S.orders.filter(x => x.customerId === cu.id).length;
  return `<div class="page">
    <a class="crumb" href="#orders">${ic('chevL')}Orders</a>
    <div class="ph">
      <div>
        <p class="eyebrow">Order #${o.id}</p>
        <h1 class="money-h">${naira(c.total)} ${payPill(c)} ${fulPill(c)}</h1>
        <p class="sub">For <a href="#customer/${cu.id}">${esc(cu.name)}</a>, placed ${fmtY(o.created)} on ${o.channel}</p>
      </div>
      <div class="acts">
        ${!c.delivered && c.owed > 0 && !c.claim ? `<button class="btn" data-act="remind" data-id="${o.id}">${ic('chat')}Send reminder</button>` : ''}
        <div class="menu"><button class="btn" data-act="menu" aria-haspopup="true" aria-label="More actions">${ic('more')}</button>
          <div class="menu-pop" role="menu">
            <a href="#status/${o.id}" target="_blank" rel="noopener" role="menuitem">${ic('ext')}View order status page</a>
            <button data-act="copy-status" data-id="${o.id}" role="menuitem">${ic('link')}Copy order status link</button>
            <hr>
            <button data-act="change-customer" data-id="${o.id}" role="menuitem">${ic('customers')}Change customer</button>
          </div></div>
      </div>
    </div>
    ${c.claim ? `<div class="banner" role="status">${ic('alert')}<div><strong>${esc(first(cu.name))} sent proof of a ${naira(c.claim.amount)} ${payWord(c.claim.method)}</strong><p>Reference ${esc(c.claim.ref)}, sent ${ago(c.claim.date)}. Check it reached your account before confirming.</p><div class="acts"><button class="btn primary" data-act="confirm-claim" data-id="${o.id}">Confirm payment</button><button class="btn" data-act="reject-claim" data-id="${o.id}">Not received</button></div></div></div>` : ''}
    <div class="detail">
      <div class="d-main">
        <section class="sec">
          <div class="sec-h"><h2>Items <span class="n">${itemCount(o)}</span></h2></div>
          ${c.fulfillable.length ? `<div class="group"><div class="group-h">${pill('Ready to fulfill', 'amber')}<span class="muted">${methodText(o, cu)}</span><span class="acts"><button class="btn ${primary === 'fulfill' ? 'primary' : ''} sm" data-act="fulfill" data-id="${o.id}">${pickup ? 'Mark as picked up' : 'Mark as fulfilled'}</button></span></div>${c.fulfillable.map(lineRow).join('')}</div>` : ''}
          ${c.held.length ? `<div class="group"><div class="group-h">${pill('On hold')}${canRelease ? `<span class="acts"><button class="btn sm" data-act="release" data-id="${o.id}">Release hold</button></span>` : ''}</div>
            <ul class="reasons">${c.reasons.map(r => `<li><span>${esc(r.text)}</span>${reasonAction(r, o)}</li>`).join('')}</ul>${c.held.map(lineRow).join('')}</div>` : ''}
          ${fulfilledItems.length ? `<div class="group"><div class="group-h">${pill('Fulfilled', 'green', 'check')}<span class="muted">${o.deliveredOn ? fmtY(o.deliveredOn) + '. ' : ''}${methodText(o, cu)}</span></div>${fulfilledItems.map(lineRow).join('')}</div>` : ''}
        </section>
        <section class="sec">
          <div class="sec-h"><h2>Payment</h2>${!c.delivered && (c.owed > 0 || !c.final) ? `<div class="acts"><button class="btn ${primary === 'pay' ? 'primary' : ''} sm" data-act="mark-paid" data-id="${o.id}">Mark as paid</button></div>` : ''}</div>
          <div class="kv">
            <span>Subtotal<small>${plural(itemCount(o), 'item')}</small></span><span>${naira(c.goods)}</span>
            <span>Shipping<small>${shipRow[0]}</small></span><span>${shipRow[1]}</span>
            <span>Delivery<small>${delRow[0]}</small></span><span>${delRow[1]}</span>
            <span class="tot">Total${c.final ? '' : ' so far'}</span><span class="tot">${naira(c.total)}</span>
          </div>
          <div class="kv">
            <span>Paid by customer</span><span class="green">${naira(c.paid)}</span>
            <span class="tot">${c.owed < 0 ? 'Credit' : 'Balance due'}</span><span class="tot">${naira(Math.abs(c.owed))}</span>
          </div>
          <ul class="plist">
            ${o.payments.map((p, n) => `<li><span class="d">${fmt(p.date)}</span><span>${n === 0 ? 'Deposit' : 'Payment'}<small>${p.method}${p.ref ? `, ${esc(p.ref)}` : ''}</small></span><span class="a">+${naira(p.amount)}</span></li>`).join('')}
            ${c.owed > 0 ? `<li><span class="d">Due</span><span>Balance<small>${c.final ? 'Before delivery' : 'When everything has arrived and the delivery method is set'}</small></span><span class="a due">${naira(c.owed)}</span></li>` : ''}
          </ul>
        </section>
      </div>
      <aside class="d-side">
        <section class="sec">
          <div class="sec-h"><h2>Details</h2></div>
          <ul class="facts">
            <li><div class="fh">Customer<button class="link" data-act="change-customer" data-id="${o.id}">Change</button></div><p><a href="#customer/${cu.id}">${esc(cu.name)}</a></p><p class="muted">${esc(cu.phone)} on WhatsApp</p><p class="muted">${esc(placeOf(cu.area))}, ${plural(custOrders, 'order')}</p></li>
            <li><div class="fh">Delivery method${!c.delivered ? `<button class="link" data-act="delivery" data-id="${o.id}">${o.delivery ? 'Edit' : 'Choose'}</button>` : ''}</div>${!o.delivery ? '<p class="muted">Not chosen yet. The customer can choose on their order page.</p>' : pickup ? `<p>Pickup at ${STORE.hub}</p><p class="muted">Free</p>` : `<p>Delivery to ${esc(placeOf(cu.area))}</p><p class="muted">${naira(o.delivery.fee)}</p>`}</li>
            <li><div class="fh">${batches.length > 1 ? 'Batches' : 'Batch'}</div>${batches.map(b => `<p><a href="#batch/${b.id}">${esc(b.name)}</a> ${batchPill(b)}</p><p class="muted" style="margin-bottom:6px">${esc(b.from)} to Lagos, ${batchWhen(b)}</p>`).join('')}</li>
            <li><div class="fh">Sales channel</div><p>${o.channel}</p></li>
            <li><div class="fh">Customer’s order page</div><p><a href="#status/${o.id}" target="_blank" rel="noopener">View</a> <span class="faint">or</span> <button class="link" data-act="copy-status" data-id="${o.id}">copy link</button></p></li>
          </ul>
        </section>
      </aside>
      <div class="d-tl">${timelineHTML(o.log, 'order', o.id)}</div>
    </div>
  </div>`;
}

let noteOpen = null;
function timelineHTML(log, kind, id) {
  const rows = [...log].map((l, n) => ({ ...l, n })).sort((a, b) => toMs(b.date) - toMs(a.date) || b.n - a.n);
  const key = `${kind}:${id}`;
  return `<section class="sec">
    <div class="sec-h"><h2>Timeline</h2><div class="acts"><button class="btn sm" data-act="note-open" data-id="${key}">${ic('plus')}Add note</button></div></div>
    ${noteOpen === key ? `<form class="note-box" data-note="${key}"><textarea name="c" placeholder="Add a note. Only your team can see it." aria-label="Note"></textarea><div class="acts"><button type="button" class="btn sm" data-act="note-cancel">Cancel</button><button type="submit" class="btn primary sm">Add note</button></div></form>` : ''}
    <ul class="tl">${rows.map(l => `<li class="${l.kind === 'comment' ? 'note' : ''}"><span>${esc(l.text)}</span><small>${fmtY(l.date)}</small></li>`).join('')}</ul>
  </section>`;
}

function batchesPage() {
  const order = { received: 0, transit: 1, open: 2, closed: 3 };
  const list = [...S.batches].sort((a, b) => order[a.status] - order[b.status] || toMs(b.createdOn) - toMs(a.createdOn));
  const units = s => sum(S.batches.filter(b => b.status === s).map(batchUnits));
  return `<div class="page">
    <div class="ph"><div><h1>Batches</h1><p class="sub">Each batch is one supplier order, shipped to Lagos together.</p></div><div class="acts"><a class="btn primary" href="#batches/new">${ic('plus')}New batch</a></div></div>
    <section class="panel overview">
      <div><span class="label">Taking orders</span><div class="big">${plural(units('open'), 'unit')}</div><span class="muted">${plural(openBatches().length, 'batch', 'batches')} open</span></div>
      <div class="ov-stats three">
        <div><span class="label">In transit</span><strong>${plural(units('transit'), 'unit')}</strong></div>
        <div><span class="label">Received, not fulfilled</span><strong>${plural(sum(S.orders.flatMap(o => calc(o).items.filter(i => i.here && !i.handedOver).map(i => i.qty))), 'unit')}</strong></div>
        <div><span class="label">Spare stock</span><strong>${plural(sum(S.batches.filter(b => b.status !== 'open').map(b => b.spareUnits)), 'unit')}</strong></div>
      </div>
    </section>
    <div class="tbl-wrap listify"><table class="tbl"><thead><tr><th>Batch</th><th>Route</th><th>Status</th><th class="r">Orders</th><th class="r">Received</th><th>Expected</th><th class="r">Freight cost</th></tr></thead><tbody>
      ${list.map(b => { const u = batchUnits(b); return `<tr data-href="#batch/${b.id}"><td><a class="strong" href="#batch/${b.id}" style="color:inherit">${esc(b.name)}</a><small>${b.ref}</small></td><td class="muted">${esc(b.from)} to Lagos</td><td>${batchPill(b)}</td><td class="r">${ordersIn(b).length}</td><td class="r">${['received', 'closed'].includes(b.status) ? u : 0} of ${u}</td><td>${b.eta ? fmtY(b.eta) : '<span class="faint">Not set</span>'}</td><td class="r">${b.cost ? naira(b.cost) : '<span class="faint">Not added</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <ul class="rowlist">${list.map(b => `<li><a href="#batch/${b.id}"><span class="av md">${ic('ship')}</span><span><strong>${esc(b.name)}</strong><small>${esc(b.from)} to Lagos, ${plural(ordersIn(b).length, 'order')}</small></span><span class="r">${batchPill(b)}<small class="muted">${b.eta ? `Expected ${fmt(b.eta)}` : `Closes ${fmt(b.closesOn)}`}</small></span></a></li>`).join('')}</ul>
  </div>`;
}

function batchPage(id) {
  const b = batchById(id);
  if (!b) return `<div class="page"><div class="empty"><strong>This batch doesn’t exist.</strong><a href="#batches">Back to batches</a></div></div>`;
  const os = ordersIn(b).map(o => ({ o, c: calc(o), cu: custOf(o) }));
  const forOrders = {};
  os.forEach(({ o }) => o.items.filter(i => i.batchId === b.id).forEach(i => { forOrders[i.sku] = (forOrders[i.sku] || 0) + i.qty; }));
  const skus = [...new Set([...(b.lineup || []), ...Object.keys(forOrders)])];
  const kg = batchKg(b);
  const got = ['received', 'closed'].includes(b.status);
  const readyN = os.filter(x => x.c.ready).length;
  let primary = '';
  if (b.status === 'open') primary = `<button class="btn primary" data-act="transit" data-id="${b.id}">Mark as in transit</button>`;
  if (b.status === 'transit') primary = `<button class="btn primary" data-act="receive" data-id="${b.id}">Receive items</button>`;
  if (b.status === 'received' && b.ratePerKg == null) primary = `<button class="btn primary" data-act="freight" data-id="${b.id}">Add freight cost</button>`;
  if (b.status === 'received' && b.ratePerKg != null && readyN) primary = `<a class="btn primary" href="#orders?tab=ready">Fulfill orders</a>`;
  return `<div class="page">
    <a class="crumb" href="#batches">${ic('chevL')}Batches</a>
    <div class="ph">
      <div><p class="eyebrow">${b.ref}</p><h1 class="money-h">${esc(b.name)} ${batchPill(b)}</h1><p class="sub">${esc(b.from)} to Lagos, created ${fmtY(b.createdOn)}</p></div>
      <div class="acts">${primary}</div>
    </div>
    <div class="detail">
      <div class="d-main">
        <section class="sec">
          <div class="sec-h"><h2>Products <span class="n">${skus.length}</span></h2>${b.status === 'open' ? `<div class="acts"><button class="btn sm" data-act="batch-products" data-id="${b.id}">${ic('plus')}Add products</button></div>` : ''}</div>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Product</th><th class="r">Price</th><th class="r">Preordered</th><th class="r">Weight</th><th class="r">${got ? 'Received' : 'Arrives'}</th></tr></thead><tbody>
            ${skus.map(k => { const p = P(k), q = forOrders[k] || 0; return `<tr><td><span class="who">${thumb(p, 'sm')}<span><span class="strong">${esc(p.name)}</span><small>${esc(p.variant || '')}</small></span></span></td><td class="r">${naira(p.price)}</td><td class="r">${q}</td><td class="r">${p.kg * q} kg</td><td class="r">${got ? `${q} of ${q}` : '<span class="faint">' + (b.eta ? fmt(b.eta) : 'Not set') + '</span>'}</td></tr>`; }).join('')}
            ${b.spareUnits ? `<tr><td class="muted">Spare stock to sell</td><td></td><td class="r">${b.spareUnits}</td><td class="r">${b.spareKg} kg</td><td class="r">${got ? `${b.spareUnits} of ${b.spareUnits}` : ''}</td></tr>` : ''}
          </tbody></table></div>
        </section>
        <section class="sec">
          <div class="sec-h"><h2>Orders <span class="n">${os.length}</span></h2>${b.status === 'open' ? `<div class="acts"><button class="btn sm" data-act="order-in-batch" data-id="${b.id}">${ic('plus')}New order</button></div>` : ''}</div>
          ${os.length ? orderTable(os) : '<div class="tbl-empty">No orders yet. Share the batch with customers, then add their preorders here.</div>'}
        </section>
      </div>
      <aside class="d-side">
        <section class="sec">
          <div class="sec-h"><h2>Cost summary</h2>${b.status === 'received' && b.ratePerKg != null ? `<button class="link" data-act="freight" data-id="${b.id}">Edit</button>` : ''}</div>
          <div class="kv">
            <span>Freight and clearing</span><span>${b.cost ? naira(b.cost) : '<span class="faint">Not added</span>'}</span>
            <span>Total weight</span><span>${kg} kg</span>

          </div>

function drawOESummary() {

}
function draftOrder() {
  const t = oeTotals();
  return { id: String(S.seq), customerId: od.customerId, channel: od.channel, created: TODAY,
    items: Object.entries(od.lines).map(([sku, qty]) => ({ sku, qty, price: P(sku).price, batchId: od.batchId, shipIncluded: od.inc, handedOver: false, released: false, shelf: null })),
    delivery: null, payments: od.collect === 'paid' && t.amt ? [{ id: 'pv', amount: t.amt, date: TODAY, method: od.method, ref: od.ref }] : [], claims: [], remindedOn: null, deliveredOn: null, log: [] };
}
function drawOEPreview() {
  const pv = $('#oe-pv'); if (!pv) return;
  pv.innerHTML = Object.keys(od.lines).length && od.batchId ? statusBody(draftOrder(), { preview: true })
    : `<div class="pv-empty">${ic('box')}<p>Add a customer and products to see the order page they’ll get.</p></div>`;
}
function createOrder() {
  const t = oeTotals(), b = batchById(od.batchId);
  if (!b.lineup) b.lineup = [];
  Object.keys(od.lines).forEach(k => { if (!b.lineup.includes(k)) b.lineup.push(k); });
  const o = draftOrder(); o.id = String(S.seq++);
  o.log = [{ date: TODAY, text: `Order placed on ${od.channel}`, kind: 'event' }];
  if (od.collect === 'paid') { o.payments = [{ id: 'p' + Date.now(), amount: t.amt, date: TODAY, method: od.method, ref: od.ref }]; o.log.push({ date: TODAY, text: `Deposit of ${naira(t.amt)} received by ${payWord(od.method)}${od.ref ? ` (${od.ref})` : ''}`, kind: 'event' }); }
  else { o.payments = []; o.remindedOn = TODAY; o.log.push({ date: TODAY, text: `Payment link for the ${naira(t.min)} deposit sent on WhatsApp`, kind: 'event' }); }
  S.orders.unshift(o);
  return o;
}

/* ---------- Customer order status page ---------- */
function statusBody(o, { preview = false } = {}) {
  const c = calc(o), cu = custOf(o) || { name: 'there', area: 'Lekki', phone: '' };

  const allShipped = bs.every(b => b.status !== 'open');
  const shippedOn = allShipped ? bs.map(b => b.shippedOn).sort().pop() : null;
  const arrivedOn = c.missing.length === 0 ? bs.map(b => b.receivedOn).filter(Boolean).sort().pop() : null;
  const pickup = o.delivery && o.delivery.method === 'pickup';
  const steps = [
    ['Ordered', fmt(o.created), true],
    ['Shipped', shippedOn ? fmt(shippedOn) : '', !!shippedOn],
    ['Arrived in Lagos', arrivedOn ? fmt(arrivedOn) : '', !!arrivedOn || c.delivered],
    [pickup ? 'Ready for pickup' : 'Ready', '', c.ready || c.delivered],
    [pickup ? 'Picked up' : 'Delivered', c.delivered ? fmt(o.deliveredOn) : '', c.delivered],
  ];
  const doneN = steps.filter(s => s[2]).length;
  const late = c.missing.filter(i => i.b.status !== 'open').map(i => i.b.eta).sort().pop();
  let h, lead;
  if (c.delivered) { h = pickup ? 'Your order has been picked up' : 'Your order has been delivered'; lead = `Completed on ${fmtY(o.deliveredOn)}. Thank you for ordering with ${STORE.name}.`; }
  else if (c.ready) { h = pickup ? 'Your order is ready for pickup' : 'Your order is ready for delivery'; lead = pickup ? `Collect it from our ${STORE.hub}, Monday to Saturday, 10am to 6pm.` : `We’re booking a courier to ${esc(placeOf(cu.area))}. They’ll call before they arrive.`; }

  const needsMethod = !c.missing.length && c.shipKnown && !o.delivery && !c.delivered;

        ${needsMethod ? '<button class="btn primary lg full" disabled>Choose a delivery method first</button>' : `<button class="btn primary lg full" data-act="pub-pay" data-id="${o.id}">Pay ${naira(c.owed)}</button>`}

    : `<div class="pcard"><span class="label">Payment</span><p style="display:flex;gap:6px;align-items:center;font-weight:600;margin-top:4px" class="green">${ic('check')} ${c.final ? 'Paid in full' : 'Paid so far'}</p>${!c.final ? `<p class="muted">${!c.shipKnown ? 'Shipping is added by weight when your order arrives in Lagos.' : 'Delivery is added once you choose a delivery method.'}</p>` : ''}</div>`;
  const methodBlock = c.delivered ? '' : needsMethod
    ? `<div class="pcard"><h3>How would you like to get your order?</h3>
        <button class="opt" role="radio" aria-checked="false" data-pubm="pickup"><span class="l"><span class="radio"></span><span><strong>Pickup</strong><small>${STORE.hub}, Monday to Saturday</small></span></span><strong>Free</strong></button>
        <button class="opt" role="radio" aria-checked="false" data-pubm="courier"><span class="l"><span class="radio"></span><span><strong>Delivery</strong><small>To ${esc(placeOf(cu.area))}, 1 to 3 days</small></span></span><strong class="num">${naira(fee)}</strong></button>
        <button class="btn primary lg full" id="pub-save" data-id="${o.id}" disabled>Continue</button></div>`
    : o.delivery ? `<div class="pcard" style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><span><span class="label">Delivery method</span><p style="font-weight:600;margin-top:2px">${pickup ? `Pickup at ${STORE.hub}` : `Delivery to ${esc(placeOf(cu.area))}`}</p></span>${!c.ready && !c.items.some(i => i.handedOver) ? `<button class="link" data-act="pub-change" data-id="${o.id}">Change</button>` : ''}</div>` : '';
  const ev = [{ date: o.created, text: 'Order confirmed' }];

    <p class="pub-store">${STORE.name}</p>
    <p class="hi">Hi ${esc(first(cu.name))}, order #${o.id}</p>
    <h1>${h}</h1>
    <p class="lead">${lead}</p>
    <div class="pcard"><div class="stepper-h"><i class="fill" style="width:${(doneN - 1) * 20}%"></i>${steps.map((s, n) => `<div class="step ${s[2] ? 'done' : ''} ${n === doneN - 1 ? 'now' : ''}"><i></i>${s[0]}${s[1] ? `<small>${s[1]}</small>` : ''}</div>`).join('')}</div></div>
    ${methodBlock}
    ${payBlock}
    <div class="pcard"><h3>Order summary</h3>${c.items.map(i => `<div class="pline">${thumb(i.p)}<div><div class="ln">${esc(i.p.name)}${i.qty > 1 ? ` × ${i.qty}` : ''}</div><div class="ls">${esc(i.p.variant || '')}</div></div><div class="lt">${naira(i.price * i.qty)}</div></div>`).join('')}
      <div class="kv">
        <span>Subtotal</span><span>${naira(c.goods)}</span>
        <span>Shipping</span><span>${c.items.every(i => i.shipIncluded) ? 'Included' : c.shipKnown ? naira(c.ship) : '<span class="faint">Added on arrival</span>'}</span>

      </div></div>
    <div class="pcard"><h3>Updates</h3><ul class="vt">${ev.map(e => `<li>${esc(e.text)}<span>${fmtY(e.date)}</span></li>`).join('')}</ul></div>
    <p class="pub-foot">Questions about your order? Message ${STORE.name} on WhatsApp.</p>
  </div>`;
}

function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const max = 320, k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .82)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

    body: () => `<div class="pager"><span>To <strong id="rv-to"></strong></span><span class="ctl"><button class="icon-btn" id="rv-prev" aria-label="Previous message">${ic('chevL')}</button><span id="rv-n"></span><button class="icon-btn" id="rv-next" aria-label="Next message">${ic('chevR')}</button></span></div>
      <div class="field"><textarea id="rv-txt" aria-label="Message"></textarea></div>`,
    foot: () => `<span class="left">Prototype: nothing is sent.</span><button class="btn" id="rv-skip">Don’t send</button><button class="btn primary" id="rv-go">Send ${plural(os.length, 'message')}</button>`,
    mount(el) {
      const txt = $('#rv-txt', el);
      const show = () => { const cu = custOf(os[n]); $('#rv-to', el).textContent = `${cu.name}, ${cu.phone}`; $('#rv-n', el).textContent = `${n + 1} of ${os.length}`; txt.value = texts[n]; };
      txt.addEventListener('input', () => { texts[n] = txt.value; });
      $('#rv-prev', el).addEventListener('click', () => { n = (n - 1 + os.length) % os.length; show(); });
      $('#rv-next', el).addEventListener('click', () => { n = (n + 1) % os.length; show(); });
      $('#rv-skip', el).addEventListener('click', () => { closeModal(); toast('Freight cost saved'); });
      $('#rv-go', el).addEventListener('click', () => { commit(() => os.forEach(o => { o.remindedOn = TODAY; logTo(o, logText); })); closeModal(); toast(`${plural(os.length, 'message')} sent`); });
      show();
    },
  });
}
/* Customer pays (Paystack checkout, then Starling / Cash App "Payment successful") */
function payModal(o) {
  const amt = calc(o).owed; let step = 'confirm';
  openModal({
    title: 'Paystack', size: 'sm',
    body: () => step === 'confirm' ? `<p class="faint" style="font-size:13px">Test mode. No money moves.</p><p class="muted" style="margin-top:14px">Pay ${STORE.name}</p><p class="amount">${naira(amt)}</p><div class="readonly" style="display:flex;justify-content:space-between;margin-top:10px"><span>Card ending 4081</span><span class="muted">Test card</span></div>`
      : step === 'processing' ? `<div class="center"><div class="spin"></div><p>Confirming your payment</p></div>`
      : `<div class="center"><div class="ok-circle">${ic('check')}</div><p style="font-size:17px;font-weight:600">Payment successful</p><p class="muted">${naira(amt)} paid to ${STORE.name}</p></div>`,
    foot: () => step === 'confirm' ? `${cancelBtn}<button class="btn primary" id="ps-go">Pay ${naira(amt)}</button>` : step === 'done' ? '<button class="btn primary" data-act="m-close">Done</button>' : '',
    mount(el) {
      const go = $('#ps-go', el);
      if (go) go.addEventListener('click', () => {
        step = 'processing'; modal.noClose = true; drawModal();
        setTimeout(() => {
          step = 'done'; modal.noClose = false;
          commit(() => { o.payments.push({ id: 'p' + Date.now(), amount: amt, date: TODAY, method: 'Paystack', ref: 'PSK-' + Math.random().toString(36).slice(2, 8).toUpperCase() }); logTo(o, `Payment of ${naira(amt)} received by Paystack on the order page`); });
          drawModal();
        }, 1200);
      });
    },
  });
}

/* ---------- Commit and actions ---------- */
function logTo(o, text, kind = 'event') { o.log.push({ date: TODAY, text, kind }); }
function blog(b, text, kind = 'event') { b.log.push({ date: TODAY, text, kind }); }
function settleBatches() {
  S.batches.filter(b => b.status === 'received').forEach(b => {
    const items = S.orders.flatMap(o => o.items.filter(i => i.batchId === b.id));
    if (items.length && items.every(i => i.handedOver)) { b.status = 'closed'; blog(b, 'All orders fulfilled. Batch closed'); }
  });
}
function commit(fn) { fn(); settleBatches(); save(); render(); }
const refreshOE = () => { drawOELines(); drawOESummary(); drawOEPreview(); };
const closeMenus = () => $$('.menu.open').forEach(x => x.classList.remove('open'));

const ACT = {
  'menu': el => { const m = el.closest('.menu'); const open = m.classList.contains('open'); closeMenus(); if (!open) m.classList.add('open'); },
  'copy-status': el => { const url = statusUrl(el.dataset.id); closeMenus(); try { navigator.clipboard.writeText(url).then(() => toast('Link copied'), () => toast(url)); } catch (e) { toast(url); } },
  'mark-paid': el => markPaidModal({ o: orderById(el.dataset.id) }),
  'confirm-claim': el => { const o = orderById(el.dataset.id); markPaidModal({ o, claim: o.claims[0] }); },
  'reject-claim': el => rejectClaimModal(orderById(el.dataset.id)),
  'remind': el => remindModal(orderById(el.dataset.id)),
  'delivery': el => deliveryModal(orderById(el.dataset.id)),
  'fulfill': el => fulfillModal(orderById(el.dataset.id)),
  'release': el => releaseModal(orderById(el.dataset.id)),
  'transit': el => transitModal(batchById(el.dataset.id)),
  'receive': el => receiveModal(batchById(el.dataset.id)),
  'freight': el => freightModal(batchById(el.dataset.id)),
  'change-customer': el => {
    closeMenus();
    const o = orderById(el.dataset.id);
    customerPicker({ title: 'Change customer', exclude: o.customerId, onPick: cid => {
      const before = custOf(o), after = custById(cid);
      commit(() => {
        o.customerId = cid;
        logTo(o, `Customer changed from ${before.name} to ${after.name}`);
        if (o.delivery && o.delivery.method === 'courier' && feeFor(after.area) !== o.delivery.fee) { o.delivery.fee = feeFor(after.area); logTo(o, `Delivery fee updated to ${naira(o.delivery.fee)} for ${after.area}`); }
      });
      toast(`Order moved to ${after.name}`);
    } });
  },
  'add-product': () => { closeMenus(); productDrawer({}); },
  'edit-product': el => productDrawer({ id: el.dataset.id }),
  'open-product': el => { $('#qpop').hidden = true; $('#q').value = ''; location.hash = '#products'; setTimeout(() => productDrawer({ id: el.dataset.id }), 0); },
  'add-customer': () => { closeMenus(); customerModal({}); },
  'edit-customer': el => customerModal({ id: el.dataset.id }),
  'order-for': el => { od = newOrderDraft(); od.customerId = el.dataset.id; location.hash = '#orders/new'; },
  'order-in-batch': el => { od = newOrderDraft(); od.batchId = el.dataset.id; location.hash = '#orders/new'; },
  'batch-products': el => {
    const b = batchById(el.dataset.id);
    const locked = [...new Set(ordersIn(b).flatMap(o => o.items.filter(i => i.batchId === b.id).map(i => i.sku)))];
    productPicker({ title: `Products in the ${b.name}`, selected: [...new Set([...b.lineup, ...locked])], locked,
      onDone: keys => { const added = keys.filter(k => !b.lineup.includes(k)); commit(() => { b.lineup = [...new Set([...keys, ...locked])]; if (added.length) blog(b, `${andList(added.map(k => P(k).name))} added to this batch`); }); toast('Batch products updated'); },
      onNew: () => productDrawer({ batchId: b.id }) });
  },
  'note-open': el => { noteOpen = el.dataset.id; render(); const t = $('.note-box textarea'); if (t) t.focus(); },
  'note-cancel': () => { noteOpen = null; render(); },
  /* New order editor */
  'toggle-preview': () => { od.preview = !od.preview; render(); },
  'oe-cpick': el => { od.customerId = el.dataset.id; drawOECustomer(); drawOESummary(); drawOEPreview(); },
  'oe-cadd': el => customerModal({ name: el.dataset.name, onSave: cid => { od.customerId = cid; render(); } }),
  'oe-cust-change': () => { od.customerId = null; drawOECustomer(); drawOESummary(); drawOEPreview(); const i = $('#oe-cq'); if (i) i.focus(); },
  'oe-padd': el => { od.lines[el.dataset.id] = 1; const i = $('#oe-pq'); i.value = ''; $('#oe-ppop').hidden = true; refreshOE(); },
  'oe-pnew': el => productDrawer({ name: el.dataset.name, batchId: od.batchId, onSave: pid => { od.lines[pid] = 1; render(); } }),
  'oe-inc': el => { od.lines[el.dataset.id]++; refreshOE(); },
  'oe-dec': el => { if (--od.lines[el.dataset.id] <= 0) delete od.lines[el.dataset.id]; refreshOE(); },
  'oe-drop': el => { delete od.lines[el.dataset.id]; refreshOE(); },
  'oe-create': () => {
    const t = oeTotals();
    if (!od.customerId || !od.batchId || !t.units || (od.collect === 'paid' && t.amt < t.min)) return;
    let o; commit(() => { o = createOrder(); });
    od = null; location.hash = `#order/${o.id}`; toast(`Order #${o.id} created`);
  },
  /* New batch editor */
  'be-add': () => productPicker({ selected: Object.keys(bd.lines), onDone: keys => { const next = {}; keys.forEach(k => { next[k] = bd.lines[k] || { spare: 0 }; }); bd.lines = next; render(); }, onNew: () => productDrawer({ hideBatch: true, onSave: pid => { bd.lines[pid] = { spare: 0 }; render(); } }) }),
  'be-inc': el => { bd.lines[el.dataset.id].spare++; drawBELines(); drawBESum(); },
  'be-dec': el => { const l = bd.lines[el.dataset.id]; l.spare = Math.max(0, l.spare - 1); drawBELines(); drawBESum(); },
  'be-drop': el => { delete bd.lines[el.dataset.id]; drawBELines(); drawBESum(); },
  'be-create': () => { let b; commit(() => { b = createBatch(); }); bd = null; location.hash = `#batch/${b.id}`; toast(`${b.name} created`); },
  /* Customer's order page */
  'pub-pay': el => payModal(orderById(el.dataset.id)),
  'pub-change': el => { const o = orderById(el.dataset.id); commit(() => { logTo(o, 'Customer is changing their delivery method'); o.delivery = null; }); },
  'm-close': () => { if (modal && modal.noClose) return; closeModal(); },
  'reset': () => openModal({
    title: 'Reset demo data?', size: 'sm',
    body: () => '<p>Every order, batch, product and customer goes back to the sample data. This can’t be undone.</p>',
    foot: () => `${cancelBtn}<button class="btn primary" id="rs-go">Reset demo data</button>`,
    mount(el) { $('#rs-go', el).addEventListener('click', () => { S = seed(); save(); od = null; bd = null; closeModal(); location.hash = '#home'; render(); toast('Demo data reset'); }); },
  }),
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) { const fn = ACT[a.dataset.act]; if (fn) { e.preventDefault(); fn(a, e); return; } }
  if (!e.target.closest('.menu')) closeMenus();
  if (!e.target.closest('#search')) $('#qpop').hidden = true;
  if (!e.target.closest('.combo')) $$('.combo-pop').forEach(p => { p.hidden = true; });
  const row = e.target.closest('[data-href]');
  if (row && !e.target.closest('a,button,input,label')) location.hash = row.dataset.href;
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-note]'); if (!f) return;
  e.preventDefault();
  const text = f.elements.c.value.trim(); if (!text) return;
  const [kind, id] = f.dataset.note.split(':');
  noteOpen = null;
  commit(() => { const target = kind === 'order' ? orderById(id) : batchById(id); target.log.push({ date: TODAY, text, kind: 'comment' }); });
});

/* ---------- Search (Mercury "Search for anything", ⌘K) ---------- */
function drawSearch() {
  const raw = $('#q').value.trim(), q = raw.toLowerCase().replace('#', ''), pop = $('#qpop');
  if (!q) { pop.hidden = true; return; }
  const os = S.orders.filter(o => matchOrder(o, raw)).slice(0, 5);
  const cs = S.customers.filter(c => matchCust(c, raw)).slice(0, 4);
  const bs = S.batches.filter(b => b.name.toLowerCase().includes(q) || b.ref.toLowerCase().includes(q));
  const ps = Object.values(S.products).filter(p => p.name.toLowerCase().includes(q)).slice(0, 4);
  pop.innerHTML = (os.length ? `<h4>Orders</h4>${os.map(o => { const c = calc(o); return `<a href="#order/${o.id}">${av(custOf(o).name)}<span>#${o.id} ${esc(custOf(o).name)}</span><span class="r">${payPill(c)}</span></a>`; }).join('')}` : '')
    + (cs.length ? `<h4>Customers</h4>${cs.map(c => `<a href="#customer/${c.id}">${av(c.name)}<span>${esc(c.name)}</span><span class="r muted">${esc(placeOf(c.area))}</span></a>`).join('')}` : '')
    + (bs.length ? `<h4>Batches</h4>${bs.map(b => `<a href="#batch/${b.id}"><span class="av">${ic('ship')}</span><span>${esc(b.name)}</span><span class="r">${batchPill(b)}</span></a>`).join('')}` : '')
    + (ps.length ? `<h4>Products</h4>${ps.map(p => `<a href="#products" data-act="open-product" data-id="${p.id}">${thumb(p, 'sm')}<span>${esc(p.name)}</span><span class="r muted">${naira(p.price)}</span></a>`).join('')}` : '')
    || '<p class="empty-s">No results. Try a name, order number, batch or product.</p>';
  pop.hidden = false;
}
$('#q').addEventListener('input', drawSearch);
$('#q').addEventListener('focus', drawSearch);
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const a = $('#qpop a'); if (a) { if (a.dataset.act) a.click(); else location.hash = a.getAttribute('href'); $('#q').value = ''; $('#qpop').hidden = true; $('#q').blur(); } }
  if (e.key === 'Escape') { $('#q').blur(); $('#qpop').hidden = true; }
});
$('#qpop').addEventListener('click', e => { if (e.target.closest('a')) { $('#q').value = ''; $('#qpop').hidden = true; } });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!document.body.classList.contains('editing') && !document.body.classList.contains('public')) $('#q').focus(); return; }
  if (e.key === 'Escape') {
    if (modal && !modal.noClose) { closeModal(); return; }
    closeMenus();
    $$('.combo-pop').forEach(p => { p.hidden = true; });
  }
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(text, link) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>${link ? `<a href="${link.href}">${esc(link.label)}</a>` : ''}<button aria-label="Dismiss">${ic('x')}</button>`;
  t.querySelector('button').addEventListener('click', () => t.classList.remove('show'));
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
}

/* ---------- Sidebar shortcuts ---------- */
const unitsLeft = b => sum(ordersIn(b).flatMap(o => o.items.filter(i => i.batchId === b.id && !i.handedOver).map(i => i.qty)));
// Batches that still need Seye: taking orders, at sea, or landed with freight or hand-overs outstanding
function sideBatches() {
  const rank = { open: 0, transit: 1, received: 2 };
  const when = b => toMs(b.status === 'open' ? b.closesOn : b.eta || b.closesOn);
  return S.batches.filter(b => b.status === 'open' || b.status === 'transit' || (b.status === 'received' && (!b.cost || unitsLeft(b))))
    .sort((a, b) => rank[a.status] - rank[b.status] || when(a) - when(b)).slice(0, 5);
}
function batchNote(b) {
  const inDays = n => n <= 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`;
  if (b.status === 'open') return `Closes ${inDays(dayDiff(b.closesOn))}`;
  if (b.status === 'transit') return !b.eta ? 'In transit' : dayDiff(b.eta) < 0 ? `Expected ${fmt(b.eta)}` : `Expected ${inDays(dayDiff(b.eta))}`;
  if (!b.cost) return 'Freight cost needed';
  return `${plural(unitsLeft(b), 'unit')} to fulfill`;
}

/* ---------- Render ---------- */
const NAV = [['home', 'Home', '#home', 'home'], ['orders', 'Orders', '#orders', 'orders'], ['batches', 'Batches', '#batches', 'batches'], ['products', 'Products', '#products', 'box'], ['customers', 'Customers', '#customers', 'customers']];
let lastPath = null;
function render() {
  const h = location.hash.slice(1) || 'home';
  const [path, qs] = h.split('?');
  const parts = path.split('/');
  const params = new URLSearchParams(qs || '');
  if (lastPath !== path) {
    if (lastPath === 'orders/new' && path !== 'orders/new') od = null;
    if (lastPath === 'batches/new' && path !== 'batches/new') bd = null;
    if (lastPath !== null) noteOpen = null;
    lastPath = path;
  }
  const pub = parts[0] === 'status';
  const editing = path === 'orders/new' || path === 'batches/new';
  document.body.classList.toggle('public', pub);
  document.body.classList.toggle('editing', editing);
  $('#public').hidden = !pub; $('#editor').hidden = !editing;
  if (pub) { $('#public').innerHTML = statusPage(parts[1]); mountStatus(); document.title = `Order #${parts[1]} | ${STORE.name}`; return; }
  if (editing) {
    if (path === 'orders/new') { $('#editor').innerHTML = orderEditor(); mountOrderEditor(); document.title = 'New order | PreorderDesk'; }
    else { $('#editor').innerHTML = batchEditor(); mountBatchEditor(); document.title = 'New batch | PreorderDesk'; }
    return;
  }
  let html, nav = parts[0];
  switch (parts[0]) {
    case 'orders': html = ordersPage(params.get('tab')); break;
    case 'order': html = orderPage(parts[1]); nav = 'orders'; break;
    case 'batches': html = batchesPage(); break;
    case 'batch': html = batchPage(parts[1]); nav = 'batches'; break;
    case 'products': html = productsPage(); break;
    case 'customers': html = customersPage(); break;
    case 'customer': html = customerPage(parts[1]); nav = 'customers'; break;
    default: html = homePage(); nav = 'home';
  }
  $('#main').innerHTML = html;
  const ready = S.orders.filter(o => calc(o).fulfillable.length).length;
  const bm = sideBatches();
  const bmOn = parts[0] === 'batch' && bm.some(b => b.id === parts[1]) ? parts[1] : null;
  const sideNav = bmOn ? null : nav;
  $('#sidebar').innerHTML = `<a class="org" href="#home"><span class="org-av">PS</span><span>${STORE.name}<small>PreorderDesk</small></span></a>
    <nav class="nav" aria-label="Pages">${NAV.map(([k, l, href, icn]) => `<a href="${href}" class="${k === sideNav ? 'on' : ''}" ${k === sideNav ? 'aria-current="page"' : ''}>${ic(icn)}<span>${l}</span>${k === 'orders' && ready ? `<span class="count" title="${plural(ready, 'order')} ready to fulfill">${ready}</span>` : ''}</a>`).join('')}</nav>
    ${bm.length ? `<section aria-labelledby="side-bm"><h2 class="side-h" id="side-bm">Active batches</h2><nav class="nav bm" aria-labelledby="side-bm">${bm.map(b => `<a href="#batch/${b.id}" class="${b.id === bmOn ? 'on' : ''}" ${b.id === bmOn ? 'aria-current="page"' : ''}>${ic('batches')}<span>${esc(b.name)}<small>${batchNote(b)}</small></span></a>`).join('')}</nav></section>` : ''}
    <div class="side-foot"><span>Sample data<small>Nothing is sent and no real money moves.</small></span><button class="link" data-act="reset">Reset</button></div>`;
  $('#tabbar').innerHTML = NAV.map(([k, l, href, icn]) => `<a href="${href}" class="${k === nav ? 'on' : ''}" ${k === nav ? 'aria-current="page"' : ''}>${ic(icn)}${l}</a>`).join('');
  $('#newmenu').innerHTML = `<a href="#orders/new">${ic('orders')}New order</a><a href="#batches/new">${ic('batches')}New batch</a><hr><button data-act="add-product">${ic('box')}Add product</button><button data-act="add-customer">${ic('customers')}Add customer</button>`;
  if (parts[0] === 'orders') { const oq = $('#oq'); oq.addEventListener('input', () => { orderQuery = oq.value; $('#orows').innerHTML = orderRows($('#orows').dataset.tab); }); }
  document.title = 'PreorderDesk';
}
window.addEventListener('hashchange', () => { if (modal) closeModal(); render(); window.scrollTo(0, 0); });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });
render();
</script>
</body>
</html>
