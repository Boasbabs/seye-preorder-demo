<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PreorderDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap">
<style>
/* v3: clean dashboard. Layout and color roles follow Mercury and Stripe (see UI-VALIDATION.md).
   Color roles: blue = what you can tap and things in motion; green = money in and things done;
   amber = your move; red = money missing; gray = waiting on someone else. */
:root{
  --bg:#ffffff; --side:#fafafa; --fill:#f5f5f7; --fill-2:#ececf0; --hover:#f7f7f9;
  --line:#e6e6eb; --line-2:#f0f0f3; --field:#d6d6db;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#a1a1a6;
  --blue:#0071e3; --blue-h:#0062c4; --blue-soft:#e9f2fd; --blue-t:#0058b0;
  --green:#1d7a3a; --green-soft:#e7f5eb;
  --amber:#965a00; --amber-soft:#fff1d6;
  --red:#c0312b; --red-soft:#fdecea;
  --gray-soft:#f0f0f2; --gray-t:#5d5d62;
  --ring:0 0 0 3px rgba(0,113,227,.18);
  --f:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num,.tbl td,.kv,.big,.money-h,.amount{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .green{color:var(--green)} .red{color:var(--red)}
.label{display:block;font-size:13px;color:var(--ink-2);font-weight:500}

/* Shell (Mercury, Stripe): quiet sidebar, white canvas */
.sidebar{position:fixed;inset:0 auto 0 0;width:224px;background:var(--side);border-right:1px solid var(--line-2);padding:12px 10px 0;display:flex;flex-direction:column;gap:18px;z-index:20;overflow-y:auto}
.org{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;color:var(--ink);font-size:13px;font-weight:600;line-height:1.25}
.org:hover{background:var(--fill);text-decoration:none}
.org-av{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;flex:none}
.org small{display:block;font-weight:400;color:var(--ink-2);font-size:12px;line-height:1.25}
/* Rows: Mercury's 13px labels, gray icons, gray fill on the current page, plain counts */
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;min-height:30px;padding:0 8px;border-radius:7px;color:#424245;font-size:13px;line-height:1.45}
.nav a .ic{width:16px;height:16px;color:var(--ink-3)}
.nav a:hover{background:var(--fill);color:var(--ink);text-decoration:none}
.nav a.on{background:var(--fill-2);color:var(--ink);font-weight:500}
.nav a.on .ic{color:var(--ink)}
.nav .count{margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* Shortcuts with a status line (Mercury's Bookmarks) */
.side-h{font-size:12px;font-weight:500;color:var(--ink-3);padding:0 8px 4px}
.nav.bm a{align-items:flex-start;padding:5px 8px}
.nav.bm a .ic{margin-top:2px}
.nav.bm small{display:block;font-size:12px;font-weight:400;color:var(--ink-2);line-height:1.35}
/* Pinned last row (Stripe's Developers row) */
.side-foot{margin:auto -10px 0;border-top:1px solid var(--line-2);padding:12px 18px 14px;display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.4;color:var(--ink)}
.side-foot small{display:block;font-size:12px;color:var(--ink-3)}
.side-foot .link{margin-left:auto;font-size:12px}
.main-wrap{margin-left:224px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:15;height:60px;display:flex;align-items:center;gap:12px;padding:0 40px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px)}
.search{position:relative;flex:1;max-width:440px}
.search>.ic{position:absolute;left:12px;top:9px;color:var(--ink-3);width:18px;height:18px}
.search input{width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);padding:0 54px 0 38px;font-size:14px}
.search input:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 1px var(--blue),var(--ring)}
.search kbd{position:absolute;right:10px;top:8px;font:500 11px var(--f);color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:18px;background:#fff}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pop{position:absolute;left:0;right:0;top:44px;background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);padding:6px;max-height:460px;overflow:auto;z-index:50}
.pop h4{margin:10px 10px 4px;font-size:12px;font-weight:500;color:var(--ink-3)}
.pop a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink)}
.pop a .r{margin-left:auto}
.pop a:hover{background:var(--fill);text-decoration:none}
.pop .empty-s{padding:14px 10px;color:var(--ink-2)}
.page{max-width:1120px;margin:0 auto;padding:20px 40px 96px}

/* Headers */
.ph{display:flex;align-items:flex-start;gap:16px;margin:12px 0 28px;flex-wrap:wrap}
.ph h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.022em}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .sub{color:var(--ink-2);margin-top:4px}
.ph .who-h{display:flex;gap:16px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:2px;color:var(--ink-2);font-weight:500;font-size:13px;margin:8px 0 0 -4px}
.crumb .ic{width:16px;height:16px}
.crumb:hover{color:var(--ink);text-decoration:none}
.eyebrow{color:var(--ink-2);font-size:13px;font-weight:500;margin-bottom:2px}
.money-h{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.026em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.money-h .pill{letter-spacing:0}
.hello-date{color:var(--ink-2);margin-top:16px}
.hello{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.024em;margin-top:2px}

/* Buttons: pill shapes; one blue action per screen (Mercury) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border:0;border-radius:999px;background:var(--fill);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--fill-2);text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-h)}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn.full{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.38;pointer-events:none}
.btn .ic{width:16px;height:16px}
.icon-btn{width:34px;height:34px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--ink-2);padding:0;flex:none}
.icon-btn:hover{background:var(--fill);color:var(--ink)}
.icon-btn .ic{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:500;cursor:pointer;font-size:inherit}
.link:hover{text-decoration:underline}
.link.muted{color:var(--ink-2)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}

/* Status pills (Stripe tones, used only where they carry meaning) */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;line-height:22px;white-space:nowrap;background:var(--gray-soft);color:var(--gray-t);vertical-align:middle}
.pill .ic{width:12px;height:12px;stroke-width:2.4}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue-t)}

/* Overview panel (Mercury balance card) */
.panel{border:1px solid var(--line);border-radius:16px;padding:24px 28px}
.overview{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:28px;align-items:center;margin:0 0 44px}
.big{font-size:40px;line-height:46px;font-weight:600;letter-spacing:-.03em;margin:4px 0 2px}
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line)}
.ov-stats.three{grid-template-columns:repeat(3,1fr)}
.ov-stats>*{padding:4px 22px;color:var(--ink);display:block}
.ov-stats>*+*{border-left:1px solid var(--line-2)}
.ov-stats a:hover{text-decoration:none}
.ov-stats a:hover strong{text-decoration:underline}
.ov-stats strong{display:block;font-size:20px;line-height:28px;font-weight:600;margin-top:4px;letter-spacing:-.012em;font-variant-numeric:tabular-nums}

/* Sections (Stripe): heading, hairline, content. No boxes. */
.sec{margin:0 0 48px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 12px;border-bottom:1px solid var(--line);margin:0 0 4px;min-height:42px}
.sec-h h2{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.012em;display:flex;align-items:center;gap:8px}
.sec-h .acts{display:flex;gap:8px;align-items:center}
.sec-h .n{color:var(--ink-3);font-weight:400}

/* To do (Jobber) */
.todo{list-style:none;margin:0;padding:0}
.todo li+li{border-top:1px solid var(--line-2)}
.todo a{display:grid;grid-template-columns:36px minmax(0,1fr) 18px;gap:14px;align-items:center;padding:14px 8px;margin:0 -8px;color:var(--ink);border-radius:12px}
.todo a:hover{background:var(--hover);text-decoration:none}
.ti{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-2)}
.ti.amber{background:var(--amber-soft);color:var(--amber)} .ti.green{background:var(--green-soft);color:var(--green)}
.ti.red{background:var(--red-soft);color:var(--red)} .ti.blue{background:var(--blue-soft);color:var(--blue)}
.todo strong{display:block;font-weight:500}
.todo small{display:block;color:var(--ink-2);font-size:13px;margin-top:1px}
.chev{color:var(--ink-3)}
.empty{padding:44px 0;text-align:center;color:var(--ink-2)}
.empty .ic{width:28px;height:28px;color:var(--green)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin:8px 0 2px}

/* Tabs (Stripe underline) and list toolbar */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 0;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink);text-decoration:none}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{color:var(--ink-3);margin-left:6px;font-weight:400}
.toolbar{display:flex;gap:8px;margin:0 0 8px}
.search-in{position:relative;flex:1;max-width:360px}
.search-in.full{max-width:none;margin:0 0 8px}
.search-in .ic{position:absolute;left:12px;top:10px;width:16px;height:16px;color:var(--ink-3)}
.search-in input{width:100%;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 36px;background:#fff}
.search-in input:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}

/* Tables (Mercury transactions, Stripe lists) */
.tbl-wrap{overflow-x:auto;margin:0 -12px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr[data-href]{cursor:pointer}
.tbl tr[data-href]:hover td,.tbl tr[data-act]:hover td{background:var(--hover)}
.tbl .who{display:flex;align-items:center;gap:12px}
.tbl .strong{font-weight:500;color:var(--ink)}
.tbl a.strong:hover{text-decoration:none}
.tbl small{display:block;color:var(--ink-2);font-size:12px;line-height:1.35}
.tbl-empty{padding:32px 0;color:var(--ink-2);text-align:center}
.rowlist{display:none;list-style:none;margin:0;padding:0}
.rowlist li+li{border-top:1px solid var(--line-2)}
.rowlist a{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;color:var(--ink)}
.rowlist a:hover{text-decoration:none}
.rowlist strong{display:block;font-weight:500}
.rowlist small{display:block;color:var(--ink-2);font-size:13px}
.rowlist .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Avatars and product photos */
.av{width:28px;height:28px;border-radius:50%;background:var(--fill-2);color:var(--ink-2);display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.av.md{width:36px;height:36px;font-size:13px}
.av.lg{width:56px;height:56px;font-size:19px}
.av.xl{width:72px;height:72px;font-size:24px}
.av .ic{width:55%;height:55%}
.thumb{width:40px;height:40px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--ink-3);flex:none;object-fit:cover}
.thumb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.thumb.sm{width:32px;height:32px;border-radius:8px} .thumb.sm svg{width:18px;height:18px}
.thumb.lg{width:72px;height:72px;border-radius:14px} .thumb.lg svg{width:32px;height:32px}
img.thumb{display:block}

/* Detail pages (Stripe payment page): main sections, details column, timeline */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-areas:"main side" "tl side";grid-template-rows:auto 1fr;gap:0 56px;align-items:start}
.d-main{grid-area:main;min-width:0} .d-side{grid-area:side;min-width:0} .d-tl{grid-area:tl;min-width:0}
.d-side .sec-h h2{font-size:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;padding:14px 0}
.kv>span:nth-child(odd){color:var(--ink-2)}
.kv>span:nth-child(even){text-align:right}
.kv .tot{color:var(--ink)!important;font-weight:600}
.kv small{display:block;color:var(--ink-3);font-size:12px}
.kv+.kv{border-top:1px solid var(--line-2)}
.facts{list-style:none;margin:0;padding:0}
.facts li{padding:14px 0;border-bottom:1px solid var(--line-2)}
.facts li:last-child{border-bottom:0}
.fh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:4px}
.fh .link{font-size:13px}
.facts p{color:var(--ink)}
.facts p.muted{color:var(--ink-2)}
.group{padding:16px 0 6px}
.group+.group{border-top:1px solid var(--line-2)}
.group-h{display:flex;align-items:center;gap:10px;margin:0 0 4px;flex-wrap:wrap;min-height:30px}
.group-h .muted{font-size:13px}
.group-h .acts{margin-left:auto;display:flex;gap:8px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto 100px;gap:14px;align-items:center;padding:10px 0}
.line .thumb{width:44px;height:44px}
.ln{font-weight:500}
.ls{color:var(--ink-2);font-size:13px}
.lq{color:var(--ink-2);font-size:13px;white-space:nowrap}
.lt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.reasons{list-style:none;margin:2px 0 6px;padding:0}
.reasons li{display:flex;gap:10px;align-items:baseline;padding:3px 0;color:var(--ink-2);font-size:13px}
.reasons li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none;transform:translateY(-1px)}
.reasons li span{flex:1}
.reasons li .link,.reasons li a{font-size:13px;white-space:nowrap}
/* Received progress (Shopify purchase order: "Total received: 0 of 3" and a bar per line) */
.rbar{position:relative;height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden;min-width:64px}
.rbar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:3px}
.rbar i.now{background:var(--blue)}
.rcell{display:inline-flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:72px}
.rcell .rbar{width:72px}
.rtot{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.rtot .rbar{flex:1}
.rtot span{white-space:nowrap;color:var(--ink-2);font-size:13px}
/* Deliveries on a batch page (Shopify order page fulfillment cards, H&M "Package 1") */
.dline{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0}
.dline .thumb{width:36px;height:36px}
.dline .num{color:var(--ink-2)}
/* Inventory and dispatch (Shopify inventory: Committed, Available, On hand, Incoming; Square Shipments; Fresha activity list) */
.chg{font-weight:500;font-variant-numeric:tabular-nums}
.chg.in{color:var(--green)}
.tbl td.wrap{white-space:normal;min-width:180px}
.tbl .zero{color:var(--ink-3)}
.adj-now{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin:-4px 0 12px}
.adj-now strong{color:var(--ink);font-variant-numeric:tabular-nums}
.rcv-i.sp{cursor:default}
/* Receive items (Shopify "Receive items", Shopify split fulfillment checkboxes, Fresha "Receive order") */
.rcv-g{border-top:1px solid var(--line-2);padding:10px 0}
.rcv-g:first-of-type{border-top:0}
.rcv-h,.rcv-i{display:grid;gap:12px;align-items:center}
.rcv-h{grid-template-columns:18px 40px minmax(0,1fr) auto;cursor:pointer}
.rcv-i{grid-template-columns:18px minmax(0,1fr) auto;padding:7px 0 7px 30px;font-size:13px;cursor:pointer}
.rcv-i.done{cursor:default;color:var(--ink-2)}
.rcv-i.done .ic{width:16px;height:16px;color:var(--green);stroke-width:2.2}
.rcv-h input,.rcv-i input{width:18px;height:18px;margin:0;accent-color:var(--blue)}
.rcv-h strong{display:block;font-weight:500}
.rcv-h small,.rcv-i small{display:block;color:var(--ink-2);font-size:12px}
.rcv-sp{display:grid;grid-template-columns:18px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.rcv-sp strong{display:block;font-weight:500}
.rcv-sp small{display:block;color:var(--ink-2);font-size:12px}
.qty-in{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.qty-in input{width:64px;height:32px;border:1px solid var(--field);border-radius:8px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums;background:#fff}
.qty-in input:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.rcv-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;margin:2px 0 8px;flex-wrap:wrap}
.rcv-top .label,.rcv-top .link{white-space:nowrap}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.plist li:last-child{border-bottom:0}
.plist .d{color:var(--ink-2);font-size:13px}
.plist .a{font-weight:500;color:var(--green);font-variant-numeric:tabular-nums}
.plist .a.due{color:var(--ink)}
.plist small{display:block;color:var(--ink-2);font-size:12px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:14px;background:var(--amber-soft);margin:0 0 36px}
.banner>.ic{color:var(--amber);margin-top:1px}
.banner strong{display:block;font-weight:600}
.banner p{color:#6b4a14}
.banner .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Timeline (Stripe) */
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{position:relative;padding:0 0 18px 26px}
.tl li::before{content:"";position:absolute;left:5px;top:7px;width:9px;height:9px;border-radius:50%;background:#c7c7cc}
.tl li::after{content:"";position:absolute;left:9px;top:20px;bottom:2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.note::before{background:var(--blue)}
.tl li.note span{display:inline-block;background:var(--fill);border-radius:10px;padding:6px 10px}
.tl small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.note-box{margin:14px 0 4px;padding:12px;border:1px solid var(--line);border-radius:12px}
.note-box textarea{width:100%;border:0;outline:none;resize:vertical;min-height:64px;font-size:14px}
.note-box .acts{display:flex;justify-content:flex-end;gap:8px}

/* Menus */
.menu{position:relative}
.menu-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:230px;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.13),0 0 0 1px rgba(0,0,0,.05);padding:6px}
.menu.open .menu-pop{display:block}
.menu-pop a,.menu-pop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--ink);text-align:left;font-weight:400;font-size:14px}
.menu-pop a:hover,.menu-pop button:hover{background:var(--fill);text-decoration:none}
.menu-pop .ic{width:16px;height:16px;color:var(--ink-2)}
.menu-pop hr{border:0;border-top:1px solid var(--line-2);margin:6px 4px}

/* Forms (Apple-style fields and segmented control) */
.field{margin:0 0 16px;min-width:0}
.field>label,.field>.label{display:block;margin:0 0 6px;font-weight:500;font-size:13px;color:var(--ink)}
.req,.opt-l{color:var(--ink-3);font-weight:400}
.field input:not([type=checkbox]):not([type=radio]):not([type=file]),.field select,.field textarea{width:100%;height:40px;border:1px solid var(--field);border-radius:10px;padding:0 12px;background:#fff;font-size:14px}
.field textarea{height:auto;min-height:150px;padding:10px 12px;line-height:1.5;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8e8e93 50%),linear-gradient(135deg,#8e8e93 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.input-pre,.input-post{display:flex;align-items:center;height:40px;border:1px solid var(--field);border-radius:10px;background:#fff;overflow:hidden}
.input-pre>span{color:var(--ink-2);padding:0 0 0 12px;white-space:nowrap}
.input-post>span{color:var(--ink-2);padding:0 12px 0 0}
.field .input-pre input,.field .input-post input,.input-pre input{flex:1;min-width:0;border:0!important;height:38px!important;box-shadow:none!important;padding:0 12px 0 6px!important;background:none!important;outline:none}
.field .input-post input{padding:0 6px 0 12px!important}
.input-pre:focus-within,.input-post:focus-within{border-color:var(--blue);box-shadow:var(--ring)}
.help{color:var(--ink-2);font-size:13px;margin-top:6px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.err .link{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.check{display:flex;align-items:center;gap:10px;margin:12px 0}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.seg{display:inline-flex;padding:3px;background:var(--fill);border-radius:10px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--ink-2);font-size:13px}
.seg button[aria-checked="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04)}
.readonly{padding:10px 12px;border-radius:10px;background:var(--fill)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;margin:0 0 10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink)}
.opt strong{display:block;font-weight:600}
.opt small{display:block;color:var(--ink-2);font-size:13px}
.opt[aria-checked="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid #c7c7cc;flex:none}
.opt[aria-checked="true"] .radio{border:5px solid var(--blue)}
.opt .l{display:flex;gap:12px;align-items:center}
.rc{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer;margin:0 0 10px}
.rc input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--blue)}
.rc strong{display:block;font-weight:600}
.rc small{display:block;color:var(--ink-2);font-size:13px}
.rc.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.rc-body{margin:-4px 0 14px;padding:16px;border-radius:12px;background:var(--fill)}
.rc-body .field input,.rc-body .input-pre{background:#fff}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:32px;background:#fff}
.stepper button{width:30px;height:30px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);padding:0}
.stepper button:hover{background:var(--fill);color:var(--ink)}
.stepper button .ic{width:14px;height:14px}
.stepper span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}

/* Modal and drawer (Stripe "Add a product" side panel) */
.ov-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);animation:fade .15s}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100vh - 64px);display:flex;flex-direction:column;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.04);animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.modal.sm{width:min(440px,calc(100% - 32px))}
.drawer{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.14);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
.still{animation:none!important}
.m-h{display:flex;align-items:center;gap:10px;padding:18px 18px 6px 24px}
.m-h h2{font-size:18px;font-weight:600;letter-spacing:-.012em;flex:1}
.m-b{padding:12px 24px 8px;overflow:auto}
.m-b>p{margin:0 0 14px;color:var(--ink-2)}
.m-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:16px 24px 20px}
.m-f .left{margin-right:auto;color:var(--ink-3);font-size:13px}
.drawer .m-h{padding:18px 18px 14px 24px;border-bottom:1px solid var(--line-2)}
.drawer .m-b{flex:1;padding:22px 24px}
.drawer .m-f{border-top:1px solid var(--line-2)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.center{text-align:center}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);margin:8px auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ok-circle{width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:8px auto 14px}
.ok-circle .ic{width:30px;height:30px;stroke-width:2.2}
.pick-list{list-style:none;margin:0;padding:0;max-height:380px;overflow:auto}
.pick-list button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border:0;background:none;border-radius:10px;text-align:left;color:var(--ink)}
.pick-list button:hover{background:var(--fill)}
.pick-list strong{display:block;font-weight:500}
.pick-list small{display:block;color:var(--ink-2);font-size:13px}
.pick-list .pad{padding:16px 8px}
.picklist{list-style:none;margin:4px 0 0;padding:0;max-height:380px;overflow:auto}
.picklist label{display:grid;grid-template-columns:18px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line-2);cursor:pointer}
.picklist li:first-child label{border-top:0}
.picklist input{width:18px;height:18px;accent-color:var(--blue)}
.picklist small{display:block;color:var(--ink-2);font-size:12px}
.picklist label.locked{cursor:default}
.contact-head{display:flex;justify-content:center;margin:4px 0 20px}
.photo-row{display:flex;gap:16px;align-items:center}
.photo-row .acts{display:flex;gap:10px;align-items:center}
.pv-card{display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;background:var(--fill)}
.pv-card strong{display:block;font-weight:600}
.pv-card small{display:block;color:var(--ink-2);font-size:13px}
.pv-card .price{margin-top:4px;font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}
.pager .ctl{display:flex;align-items:center;gap:2px;color:var(--ink-2);font-size:13px}

/* Full-screen editors (Stripe "Create invoice", Mercury invoice, Fresha purchase order) */
body.editing #app{display:none}
#editor{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column}
.ed-bar{height:60px;display:flex;align-items:center;gap:10px;padding:0 20px 0 14px;border-bottom:1px solid var(--line-2);flex:none}
.ed-title{font-weight:600;font-size:15px;white-space:nowrap}
.ed-bar .sp{flex:1}
.ed-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.ed-body.with-preview{grid-template-columns:minmax(0,1fr) minmax(400px,44%)}
.ed-body.batch{grid-template-columns:minmax(0,1fr) 360px}
.ed-form{overflow:auto;padding:40px 48px 96px}
.ed-in{max-width:560px;margin:0 auto}
.ed-in.wide{max-width:760px}
.ed-h1{font-size:26px;line-height:32px;font-weight:600;letter-spacing:-.02em}
.ed-sec{padding:0 0 28px;margin:0 0 28px;border-bottom:1px solid var(--line-2)}
.ed-sec:last-child{border-bottom:0;margin-bottom:0}
.ed-sec>h2{font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}
.ed-preview{background:var(--fill);overflow:auto;padding:28px 36px;border-left:1px solid var(--line-2)}
.pv-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 auto 14px;max-width:460px}
.pv-frame{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.05);overflow:hidden;max-width:460px;margin:0 auto}
.pv-empty{padding:56px 28px;text-align:center;color:var(--ink-2)}
.pv-empty .ic{width:28px;height:28px;color:var(--ink-3);margin-bottom:8px}
.ed-side{border-left:1px solid var(--line-2);overflow:auto;padding:32px 28px 40px;background:var(--side)}
.ed-side .field input,.ed-side .field select{background:#fff}
.static{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.static strong{display:block;font-weight:500}
.static small{display:block;color:var(--ink-2);font-size:12px}
.static .ic{color:var(--ink-2)}
.side-sum{margin:8px 0 0;padding:4px 16px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.combo{position:relative}
.combo>.ic{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--ink-3);z-index:1}
.combo input{width:100%;height:42px;border:1px solid var(--field);border-radius:10px;padding:0 12px 0 38px;background:#fff;font-size:14px}
.combo input:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.combo input:disabled{background:var(--fill)}
.combo-pop{position:absolute;left:0;right:0;top:48px;z-index:10;background:#fff;border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05);padding:6px;max-height:360px;overflow:auto}
.combo-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;color:var(--ink)}
.combo-opt:hover{background:var(--fill)}
.combo-opt.add{color:var(--blue);font-weight:500}
.combo-opt.add .ic{width:16px;height:16px}
.combo-opt strong{display:block;font-weight:500}
.combo-opt small{display:block;color:var(--ink-2);font-size:12px}
.combo-opt .r{margin-left:auto;color:var(--ink-2);font-size:13px;white-space:nowrap}
.combo-label{padding:10px 10px 4px;font-size:12px;color:var(--ink-3);font-weight:500}
.picked{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.picked strong{display:block;font-weight:600}
.picked small{display:block;color:var(--ink-2);font-size:13px}
.picked .link{margin-left:auto}
.eline{display:grid;grid-template-columns:40px minmax(0,1fr) auto 92px 30px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.eline:first-child{margin-top:8px}
.addmore{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:1.5px dashed #cfcfd4;border-radius:12px;background:#fff;color:var(--blue);font-weight:500;margin-top:14px}
.addmore:hover{background:var(--blue-soft);border-color:var(--blue)}
.addmore .ic{width:16px;height:16px}
.be-empty{padding:28px 16px;border-radius:12px;background:var(--fill);color:var(--ink-2);text-align:center}

/* Customer order status page (Shopify order status page, Blue Apron stepper, Square payment request) */
body.public{background:var(--fill)}
body.public #app{display:none}
.pub-bar{background:var(--ink);color:#fff;font-size:13px;padding:9px 20px;display:flex;justify-content:space-between;gap:12px}
.pub-bar a{color:#fff;font-weight:600}
.pub{max-width:520px;margin:0 auto;padding:28px 16px 56px}
.pv-frame .pub{padding:24px 20px 28px}
.pub-store{text-align:center;font-weight:600;font-size:15px;margin:0 0 26px}
.pub .hi{color:var(--ink-2)}
.pub h1{font-size:26px;line-height:32px;font-weight:600;letter-spacing:-.022em;margin:2px 0 6px}
.pub .lead{color:var(--ink-2);margin:0 0 22px;font-size:15px}
.pcard{background:#fff;border-radius:18px;padding:20px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.04)}
.pv-frame .pcard{box-shadow:none;border:1px solid var(--line-2)}
.pcard h3{font-size:16px;font-weight:600;margin:0 0 12px}
.pcard .kv{padding:12px 0 0}
.amount{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.026em;margin:2px 0 4px}
.stepper-h{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin:4px 0 0}
.stepper-h::before{content:"";position:absolute;left:10%;right:10%;top:7px;height:2px;background:var(--line)}
.stepper-h .fill{position:absolute;left:10%;top:7px;height:2px;background:var(--blue)}
.step{position:relative;text-align:center;font-size:12px;line-height:16px;color:var(--ink-3)}
.step i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 6px;background:#fff;border:2px solid var(--line);position:relative}
.step.done{color:var(--ink)}
.step.done i{background:var(--blue);border-color:var(--blue)}
.step.now{font-weight:600}
.step small{display:block;color:var(--ink-2);font-weight:400}
.vt{list-style:none;margin:4px 0 0;padding:0}
.vt li{position:relative;padding:0 0 14px 24px}
.vt li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.vt li::after{content:"";position:absolute;left:7.5px;top:17px;bottom:-1px;width:1px;background:var(--line)}
.vt li:last-child::after{display:none}
.vt li:first-child::before{background:var(--blue)}
.vt li span{display:block;color:var(--ink-2);font-size:12px}
.pline{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0}
.pub-foot{text-align:center;color:var(--ink-2);margin-top:22px;font-size:13px}

/* Toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);opacity:0;pointer-events:none;z-index:90;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 10px 10px 16px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:opacity .18s,transform .18s;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast a{color:#8fc3ff;font-weight:600}
#toast button{background:none;border:0;color:#fff;padding:2px;display:grid;opacity:.7}
#toast .ic{width:16px;height:16px}

/* Shopify sales channel (Shopify Bill Pay "Sync and import", QuickBooks "For review", incident.io run steps) */
.todo .row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0}
.steps{list-style:none;margin:4px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.steps li:last-child{border-bottom:0}
.steps .si{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.steps .si.amber{background:var(--amber-soft);color:var(--amber)}
.steps .si .ic{width:15px;height:15px;stroke-width:2.2}
.steps strong{display:block;font-weight:500}
.steps p{color:var(--ink-2);font-size:13px}
.m-b h3{font-size:15px;font-weight:600;margin:22px 0 4px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 16px;margin:4px 0 12px;border:1.5px dashed #cfcfd4;border-radius:14px;background:#fff;color:var(--ink-2);text-align:center;cursor:pointer}
.drop:hover,.drop.over{background:var(--blue-soft);border-color:var(--blue)}
.drop .ic{width:24px;height:24px;color:var(--blue)}
.drop strong{color:var(--blue);font-weight:500}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.cmp>div{padding:14px 16px;border-radius:12px;background:var(--fill)}
.cmp .label{margin-bottom:6px}
.tbl .clip{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.picklist .input-post input{flex:1;min-width:0;width:auto;height:38px;border:0;outline:none;background:none;padding:0 6px 0 12px;font-size:14px}
.field input:disabled{background:var(--fill);color:var(--ink-2)}
.phone-only{display:none}

/* Floating tab bar on phones (Cash App, Shopify iOS) */
.tabbar{display:none}

@media (max-width:1100px){
  .detail{grid-template-columns:1fr;grid-template-areas:"main" "side" "tl";gap:0}
  .d-side{margin-bottom:8px}
  .ed-body.with-preview{grid-template-columns:minmax(0,1fr) minmax(340px,42%)}
  .overview{grid-template-columns:1fr;gap:18px}
  .ov-stats{border-left:0;border-top:1px solid var(--line);padding-top:14px}
  .ov-stats>*:first-child{padding-left:0}
}
@media (max-width:960px){
  .ov-stats,.ov-stats.three{grid-template-columns:1fr 1fr;padding-top:4px}
  .ov-stats>*{padding:12px 0}
  .ov-stats>*+*{border-left:0}
  .ov-stats>*:nth-child(even){padding-left:16px;border-left:1px solid var(--line-2)}
}
@media (max-width:820px){
  .sidebar,.search kbd{display:none}
  .main-wrap{margin-left:0}
  .topbar{padding:0 16px}
  .page{padding:12px 16px 112px}
  .ph h1{font-size:24px;line-height:30px}
  .money-h{font-size:28px;line-height:34px}
  .overview{grid-template-columns:1fr;gap:16px;padding:20px}
  .ov-stats,.ov-stats.three{grid-template-columns:1fr 1fr;border-left:0;border-top:1px solid var(--line);padding-top:4px}
  .ov-stats>*{padding:12px 0}
  .ov-stats>*+*{border-left:0}
  .ov-stats>*:nth-child(even){padding-left:16px;border-left:1px solid var(--line-2)}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .quick .btn{flex-direction:column;height:auto;padding:14px 4px 12px;border-radius:16px;font-size:12px;gap:6px;white-space:normal;line-height:1.2;text-align:center}
  .quick .btn .ic{width:20px;height:20px}
  .tbl-wrap.listify{display:none}
  .rowlist{display:block}
  .grid2{grid-template-columns:1fr}
  .line{grid-template-columns:44px minmax(0,1fr) auto}
  .lq{grid-column:2;grid-row:2;margin-top:-8px}
  .lt{grid-row:1;grid-column:3}

/* The one place that decides payment and fulfillment status for an order. */
function calc(o) {
  const items = o.items.map(it => {
    const b = batchById(it.batchId), p = P(it.sku);
    const here = isIn(it);
    const kg = p.kg * it.qty;
    const ship = it.shipIncluded ? 0 : (b.ratePerKg != null ? Math.round(kg * b.ratePerKg / 100) * 100 : null);
    return { ...it, b, p, here, kg, ship };
  });
  const goods = sum(items.map(i => i.price * i.qty));
  const discount = o.discount || 0;
  const shipKnown = items.every(i => i.ship !== null);
  const ship = sum(items.map(i => i.ship || 0));
  const delivery = o.delivery ? o.delivery.fee : 0;
  const total = goods - discount + ship + delivery;
  const paid = sum(o.payments.map(p => p.amount));
  const owed = total - paid;
  const final = shipKnown && !!o.delivery;
  const claim = o.claims[0] || null;
  const remaining = items.filter(i => !i.handedOver);
  const missing = remaining.filter(i => !i.here);
  const reasons = [];
  if (remaining.length) {
    if (claim) reasons.push({ key: 'claim', text: `Payment pending: ${naira(claim.amount)} transfer to confirm` });
    if (missing.length) reasons.push({ key: 'items', text: `Waiting for items: ${andList(missing.map(i => `${i.p.name} (${i.b.name}, ${batchWhen(i.b)})`))}` });
    else if (!shipKnown) reasons.push({ key: 'freight', text: `Freight cost not added for the ${items.find(i => i.ship === null).b.name}` });
    else if (!o.delivery) reasons.push({ key: 'delivery', text: 'Delivery method not chosen' });
    if (!missing.length && shipKnown && owed > 0 && !claim) reasons.push({ key: 'payment', text: `Awaiting payment: ${naira(owed)} balance` });
  }
  const ready = remaining.length > 0 && reasons.length === 0;
  const fulfillable = ready ? remaining : remaining.filter(i => i.released && i.here);
  const held = remaining.filter(i => !fulfillable.includes(i));
  const delivered = remaining.length === 0;
  let pay;
  if (claim) pay = ['Payment pending', 'amber'];
  else if (paid <= 0) pay = ['Unpaid', 'red'];
  else if (owed > 0 || !final) pay = ['Partially paid', ''];
  else pay = ['Paid', 'green', 'check'];
  let ful;
  if (delivered) ful = ['Dispatched', 'green', 'check'];
  else if (items.some(i => i.handedOver)) ful = ['Partially dispatched', 'amber'];
  else if (fulfillable.length) ful = ['Ready to dispatch', 'amber'];

}

  <ul class="rowlist">${rows.map(({ o, c, cu }) => `<li><a href="#order/${o.id}">${av(cu.name, 'md')}<span><strong>${esc(cu.name)}</strong><small>#${o.id}, ${fmt(o.created)}</small></span><span class="r"><span class="num">${naira(c.total)}</span>${c.claim ? payPill(c) : c.fulfillable.length || c.delivered ? fulPill(c) : payPill(c)}</span></a></li>`).join('')}</ul>`;
}
function orderRows(tab) {
  const rows = S.orders.map(o => ({ o, c: calc(o), cu: custOf(o) })).filter(x => TAB_TEST[tab](x.c) && matchOrder(x.o, orderQuery));
  if (!rows.length) return `<div class="tbl-empty">No orders found. Try another view or search.</div>`;
  return orderTable(rows);
}

function lineRow(i) {
  let where;
  if (i.handedOver) where = '';
  else if (i.here) where = `${i.receivedOn ? `Arrived ${fmt(i.receivedOn)}. ` : ''}Shelf ${i.shelf || 'not set'}`;
  else if (i.b.status === 'open') where = `${i.b.name}, taking orders until ${fmt(i.b.closesOn)}`;
  else if (i.b.status === 'partial') where = `${i.b.name}, in a later delivery${i.b.eta ? `, expected ${fmt(i.b.eta)}` : ''}`;
  else where = `${i.b.name}, expected ${fmt(i.b.eta)}`;
  return `<div class="line">${thumb(i.p)}<div><div class="ln">${esc(i.p.name)}</div><div class="ls">${[esc(i.p.variant), where].filter(Boolean).join('. ')}</div></div><div class="lq">${naira(i.price)} × ${i.qty}</div><div class="lt">${naira(i.price * i.qty)}</div></div>`;
}
function methodText(o, cu) {
  if (!o.delivery) return 'Delivery method not chosen';
  return o.delivery.method === 'pickup' ? `Pickup at ${STORE.hub}` : `Delivery to ${esc(placeOf(cu.area))}`;
}
function reasonAction(r, o) {
  switch (r.key) {
    case 'payment': return `<button class="link" data-act="mark-paid" data-id="${o.id}">Mark as paid</button>`;
    case 'delivery': return `<button class="link" data-act="delivery" data-id="${o.id}">Choose delivery method</button>`;
    case 'freight': { const b = calc(o).items.find(i => i.ship === null).b; return `<a href="#batch/${b.id}">Add freight cost</a>`; }
    default: return '';
  }
}
function orderPage(id) {
  const o = orderById(id);
  if (!o) return `<div class="page"><div class="empty"><strong>This order doesn’t exist.</strong><a href="#orders">Back to orders</a></div></div>`;
  const c = calc(o), cu = custOf(o);
  const pickup = o.delivery && o.delivery.method === 'pickup';
  const fulfilledItems = c.items.filter(i => i.handedOver);
  const canRelease = c.held.some(i => i.here) && c.missing.length > 0;
  /* One blue action per page: confirm the transfer, else fulfill, else take payment. */
  const primary = c.claim ? 'claim' : c.fulfillable.length ? 'fulfill' : (!c.delivered && c.owed > 0) ? 'pay' : '';
  const shipRow = c.items.every(i => i.shipIncluded) ? ['Included in price', '₦0']
    : !c.shipKnown ? ['By weight, once the freight cost is added', '<span class="faint">Pending</span>']
    : [`By weight, ${sum(c.items.filter(i => !i.shipIncluded).map(i => i.kg))} kg`, naira(c.ship)];
  const delRow = !o.delivery ? ['Not chosen yet', '<span class="faint">Pending</span>'] : pickup ? [`Pickup at ${STORE.hub}`, '₦0'] : [`To ${esc(placeOf(cu.area))}`, naira(o.delivery.fee)];
  const batches = [...new Set(o.items.map(i => i.batchId))].map(batchById);
  const custOrders = S.orders.filter(x => x.customerId === cu.id).length;
  return `<div class="page">
    <a class="crumb" href="#orders">${ic('chevL')}Orders</a>
    <div class="ph">
      <div>
        <p class="eyebrow">Order #${o.id}</p>
        <h1 class="money-h">${naira(c.total)} ${payPill(c)} ${fulPill(c)}</h1>
        <p class="sub">For <a href="#customer/${cu.id}">${esc(cu.name)}</a>, placed ${fmtY(o.created)} ${channelText(o)}</p>
      </div>
      <div class="acts">
        ${!c.delivered && c.owed > 0 && !c.claim ? `<button class="btn" data-act="remind" data-id="${o.id}">${ic('chat')}Send reminder</button>` : ''}
        <div class="menu"><button class="btn" data-act="menu" aria-haspopup="true" aria-label="More actions">${ic('more')}</button>
          <div class="menu-pop" role="menu">
            <a href="#status/${o.id}" target="_blank" rel="noopener" role="menuitem">${ic('ext')}View order status page</a>
            <button data-act="copy-status" data-id="${o.id}" role="menuitem">${ic('link')}Copy order status link</button>
            <hr>
            <button data-act="change-customer" data-id="${o.id}" role="menuitem">${ic('customers')}Change customer</button>
          </div></div>
      </div>
    </div>
    ${c.claim ? `<div class="banner" role="status">${ic('alert')}<div><strong>${esc(first(cu.name))} sent proof of a ${naira(c.claim.amount)} ${payWord(c.claim.method)}</strong><p>Reference ${esc(c.claim.ref)}, sent ${ago(c.claim.date)}. Check it reached your account before confirming.</p><div class="acts"><button class="btn primary" data-act="confirm-claim" data-id="${o.id}">Confirm payment</button><button class="btn" data-act="reject-claim" data-id="${o.id}">Not received</button></div></div></div>` : ''}
    <div class="detail">
      <div class="d-main">
        <section class="sec">
          <div class="sec-h"><h2>Items <span class="n">${itemCount(o)}</span></h2></div>
          ${c.fulfillable.length ? `<div class="group"><div class="group-h">${pill('Ready to dispatch', 'amber')}<span class="muted">${methodText(o, cu)}</span><span class="acts"><button class="btn ${primary === 'fulfill' ? 'primary' : ''} sm" data-act="fulfill" data-id="${o.id}">${pickup ? 'Mark as picked up' : 'Dispatch'}</button></span></div>${c.fulfillable.map(lineRow).join('')}</div>` : ''}
          ${c.held.length ? `<div class="group"><div class="group-h">${pill('On hold')}${canRelease ? `<span class="acts"><button class="btn sm" data-act="release" data-id="${o.id}">Release hold</button></span>` : ''}</div>
            <ul class="reasons">${c.reasons.map(r => `<li><span>${esc(r.text)}</span>${reasonAction(r, o)}</li>`).join('')}</ul>${c.held.map(lineRow).join('')}</div>` : ''}
          ${fulfilledItems.length ? `<div class="group"><div class="group-h">${pill('Dispatched', 'green', 'check')}<span class="muted">${o.deliveredOn ? fmtY(o.deliveredOn) + '. ' : ''}${methodText(o, cu)}${fulfilledItems.some(i => i.dispatchId) ? `. ${[...new Set(fulfilledItems.map(i => i.dispatchId).filter(Boolean))].join(', ')}` : ''}</span></div>${fulfilledItems.map(lineRow).join('')}</div>` : ''}
        </section>
        <section class="sec">
          <div class="sec-h"><h2>Payment</h2>${!c.delivered && (c.owed > 0 || !c.final) ? `<div class="acts"><button class="btn ${primary === 'pay' ? 'primary' : ''} sm" data-act="mark-paid" data-id="${o.id}">Mark as paid</button></div>` : ''}</div>
          <div class="kv">
            <span>Subtotal<small>${plural(itemCount(o), 'item')}</small></span><span>${naira(c.goods)}</span>
            ${c.discount ? `<span>Discount<small>From Shopify</small></span><span>${naira(-c.discount)}</span>` : ''}
            <span>Shipping<small>${shipRow[0]}</small></span><span>${shipRow[1]}</span>
            <span>Delivery<small>${delRow[0]}</small></span><span>${delRow[1]}</span>
            <span class="tot">Total${c.final ? '' : ' so far'}</span><span class="tot">${naira(c.total)}</span>
          </div>
          <div class="kv">
            <span>Paid by customer</span><span class="green">${naira(c.paid)}</span>
            <span class="tot">${c.owed < 0 ? 'Credit' : 'Balance due'}</span><span class="tot">${naira(Math.abs(c.owed))}</span>
          </div>
          <ul class="plist">
            ${o.payments.map((p, n) => `<li><span class="d">${fmt(p.date)}</span><span>${p.label || (n === 0 ? 'Deposit' : 'Payment')}<small>${p.method}${p.ref ? `, ${esc(p.ref)}` : ''}</small></span><span class="a">+${naira(p.amount)}</span></li>`).join('')}
            ${c.owed > 0 ? `<li><span class="d">Due</span><span>Balance<small>${c.final ? 'Before delivery' : 'When everything has arrived and the delivery method is set'}</small></span><span class="a due">${naira(c.owed)}</span></li>` : ''}
          </ul>
        </section>
      </div>
      <aside class="d-side">
        <section class="sec">
          <div class="sec-h"><h2>Details</h2></div>
          <ul class="facts">
            <li><div class="fh">Customer<button class="link" data-act="change-customer" data-id="${o.id}">Change</button></div><p><a href="#customer/${cu.id}">${esc(cu.name)}</a></p><p class="muted">${waLine(cu)}${cu.phone ? '' : ` <button class="link" data-act="edit-customer" data-id="${cu.id}">Add</button>`}</p>${cu.email ? `<p class="muted">${esc(cu.email)}</p>` : ''}<p class="muted">${esc(placeOf(cu.area))}, ${plural(custOrders, 'order')}</p></li>
            <li><div class="fh">Delivery method${!c.delivered ? `<button class="link" data-act="delivery" data-id="${o.id}">${o.delivery ? 'Edit' : 'Choose'}</button>` : ''}</div>${!o.delivery ? '<p class="muted">Not chosen yet. The customer can choose on their order page.</p>' : pickup ? `<p>Pickup at ${STORE.hub}</p><p class="muted">Free</p>` : `<p>Delivery to ${esc(placeOf(cu.area))}</p><p class="muted">${naira(o.delivery.fee)}</p>`}</li>
            <li><div class="fh">${batches.length > 1 ? 'Batches' : 'Batch'}</div>${batches.map(b => `<p><a href="#batch/${b.id}">${esc(b.name)}</a> ${batchPill(b)}</p><p class="muted" style="margin-bottom:6px">${esc(b.from)} to Lagos, ${batchWhen(b)}</p>`).join('')}</li>
            ${o.shopify ? `<li><div class="fh">Shopify</div><p>${o.shopify.sid ? `<a href="${shopAdminUrl(o.shopify.sid)}" target="_blank" rel="noopener">Order #${o.shopify.no} in Shopify</a>` : `Order #${o.shopify.no}`}</p><p class="muted">${o.shopify.source === 'web' ? 'Website checkout' : 'Created by staff in Shopify'}. <button class="link" data-act="shop-open" data-no="${o.shopify.no}">How it came in</button></p></li>`
              : `<li><div class="fh">Sales channel</div><p>${o.channel}</p></li>`}
            <li><div class="fh">Customer’s order page</div><p><a href="#status/${o.id}" target="_blank" rel="noopener">View</a> <span class="faint">or</span> <button class="link" data-act="copy-status" data-id="${o.id}">copy link</button></p></li>
          </ul>
        </section>
      </aside>
      <div class="d-tl">${timelineHTML(o.log, 'order', o.id)}</div>
    </div>
  </div>`;
}

let noteOpen = null;
function timelineHTML(log, kind, id) {
  const rows = [...log].map((l, n) => ({ ...l, n })).sort((a, b) => toMs(b.date) - toMs(a.date) || b.n - a.n);
  const key = `${kind}:${id}`;
  return `<section class="sec">
    <div class="sec-h"><h2>Timeline</h2><div class="acts"><button class="btn sm" data-act="note-open" data-id="${key}">${ic('plus')}Add note</button></div></div>
    ${noteOpen === key ? `<form class="note-box" data-note="${key}"><textarea name="c" placeholder="Add a note. Only your team can see it." aria-label="Note"></textarea><div class="acts"><button type="button" class="btn sm" data-act="note-cancel">Cancel</button><button type="submit" class="btn primary sm">Add note</button></div></form>` : ''}
    <ul class="tl">${rows.map(l => `<li class="${l.kind === 'comment' ? 'note' : ''}"><span>${esc(l.text)}</span><small>${fmtY(l.date)}</small></li>`).join('')}</ul>
  </section>`;
}

function batchesPage() {
  const order = { received: 0, partial: 1, transit: 2, open: 3, closed: 4 };
  const list = [...S.batches].sort((a, b) => order[a.status] - order[b.status] || toMs(b.createdOn) - toMs(a.createdOn));
  const rowNote = b => b.status === 'partial' ? `${batchGot(b)} of ${batchTotal(b)} received` : (b.status === 'received' || b.status === 'closed') && b.receivedOn ? `Received ${fmt(b.receivedOn)}` : b.eta && b.status !== 'open' ? `Expected ${fmt(b.eta)}` : `Closes ${fmt(b.closesOn)}`;
  return `<div class="page">
    <div class="ph"><div><h1>Batches</h1><p class="sub">Each batch is one supplier order. It can reach Lagos in several deliveries.</p></div><div class="acts"><a class="btn primary" href="#batches/new">${ic('plus')}New batch</a></div></div>
    <section class="panel overview">
      <div><span class="label">Taking orders</span><div class="big">${plural(sum(openBatches().map(batchUnits)), 'unit')}</div><span class="muted">${plural(openBatches().length, 'batch', 'batches')} open</span></div>
      <div class="ov-stats three">
        <div title="Units shipped and not yet in Lagos, including spare stock"><span class="label">In transit</span><strong>${plural(sum(S.batches.filter(onTheWay).map(batchLeft)), 'unit')}</strong></div>
        <a href="#inventory" title="In the warehouse for customers, not yet dispatched"><span class="label">Received, not dispatched</span><strong>${plural(sum(stockAll().map(r => r.s.held)), 'unit')}</strong></a>
        <a href="#inventory" title="Spare units in the warehouse now"><span class="label">Spare stock</span><strong>${plural(sum(stockAll().map(r => r.s.spare)), 'unit')}</strong></a>
      </div>
    </section>
    <div class="tbl-wrap listify"><table class="tbl"><thead><tr><th>Batch</th><th>Route</th><th>Status</th><th class="r">Orders</th><th class="r">Received</th><th>Expected</th><th class="r">Freight cost</th></tr></thead><tbody>
      ${list.map(b => `<tr data-href="#batch/${b.id}"><td><a class="strong" href="#batch/${b.id}" style="color:inherit">${esc(b.name)}</a><small>${b.ref}</small></td><td class="muted">${esc(b.from)} to Lagos</td><td>${batchPill(b)}</td><td class="r">${ordersIn(b).length}</td><td class="r">${batchGot(b)} of ${batchTotal(b)}${b.status === 'partial' ? `<small>${plural(b.deliveries.length, 'delivery', 'deliveries')} so far</small>` : ''}</td><td>${b.eta ? `${fmtY(b.eta)}${b.status === 'partial' ? '<small>For the rest</small>' : ''}` : '<span class="faint">Not set</span>'}</td><td class="r">${b.cost ? naira(b.cost) : '<span class="faint">Not added</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <ul class="rowlist">${list.map(b => `<li><a href="#batch/${b.id}"><span class="av md">${ic('ship')}</span><span><strong>${esc(b.name)}</strong><small>${esc(b.from)} to Lagos, ${plural(ordersIn(b).length, 'order')}</small></span><span class="r">${batchPill(b)}<small class="muted">${rowNote(b)}</small></span></a></li>`).join('')}</ul>
  </div>`;
}

function batchPage(id) {
  const b = batchById(id);
  if (!b) return `<div class="page"><div class="empty"><strong>This batch doesn’t exist.</strong><a href="#batches">Back to batches</a></div></div>`;
  const os = ordersIn(b).map(o => ({ o, c: calc(o), cu: custOf(o) }));
  const lines = batchLines(b).sort((x, y) => toMs(x.o.created) - toMs(y.o.created));
  const forOrders = {}, gotBy = {};
  lines.forEach(({ i }) => { forOrders[i.sku] = (forOrders[i.sku] || 0) + i.qty; if (isIn(i)) gotBy[i.sku] = (gotBy[i.sku] || 0) + i.qty; });
  const skus = [...new Set([...(b.lineup || []), ...Object.keys(forOrders)])];
  const kg = batchKg(b);
  const shipped = b.status !== 'open';
  const dl = b.deliveries || [];
  const got = batchGot(b), total = batchTotal(b), left = total - got;
  const readyN = os.filter(x => x.c.ready).length;
  /* One blue action: the step the batch is at. While part of it is still at sea, receiving stays one tap away. */
  const recv = tone => `<button class="btn ${tone}" data-act="receive" data-id="${b.id}">Receive items</button>`;
  let primary = '';
  if (b.status === 'open') primary = `<button class="btn primary" data-act="transit" data-id="${b.id}">Mark as in transit</button>`;
  else if (b.status === 'transit') primary = recv('primary');
  else if (b.ratePerKg == null && (b.status === 'partial' || b.status === 'received')) primary = `${b.status === 'partial' ? recv('') : ''}<button class="btn primary" data-act="freight" data-id="${b.id}">Add freight cost</button>`;
  else if (b.status === 'partial') primary = readyN ? `${recv('')}<a class="btn primary" href="#dispatch">Dispatch orders</a>` : recv('primary');
  else if (b.status === 'received' && readyN) primary = `<a class="btn primary" href="#dispatch">Dispatch orders</a>`;
  const rcell = (g, q) => `<span class="rcell">${rbar(g, q)}<span>${g} of ${q}</span></span>`;
  const dRow = ({ o, i }) => `<div class="dline">${thumb(P(i.sku))}<div><div class="ln">${esc(P(i.sku).name)}</div><div class="ls">For <a href="#order/${o.id}">${esc(custOf(o).name)}</a>, #${o.id}${i.shelf ? `. Shelf ${i.shelf}` : ''}${i.handedOver ? '. Dispatched' : ''}</div></div><div class="num">× ${i.qty}</div></div>`;
  const spareRows = by => Object.entries(by || {}).filter(([, n]) => n > 0).map(([k, n]) => `<div class="dline">${thumb(P(k))}<div><div class="ln">${esc(P(k).name)}</div><div class="ls">Spare stock, <a href="${stockHref(k)}">in inventory</a></div></div><div class="num">× ${n}</div></div>`).join('');
  const spareToCome = Object.fromEntries(Object.keys(b.spareBy || {}).map(k => [k, b.spareBy[k] - spareGot(b, k)]));
  const still = lines.filter(x => !isIn(x.i));
  const deliveriesHTML = !dl.length ? '' : `<section class="sec">
          <div class="sec-h"><h2>Deliveries <span class="n">${dl.length}</span></h2></div>
          ${left ? `<div class="group"><div class="group-h">${pill(`Still to come (${left})`)}<span class="muted">${b.eta ? `Expected ${fmtY(b.eta)}` : 'Expected date not set'}</span></div>${still.map(dRow).join('')}${spareRows(spareToCome)}</div>` : ''}
          ${[...dl].reverse().map(d => { const mine = lines.filter(x => x.i.dId === d.id); return `<div class="group"><div class="group-h">${pill(`Received (${sum(mine.map(x => x.i.qty)) + d.spare})`, 'green', 'check')}<span class="muted">Delivery ${dl.indexOf(d) + 1}, ${fmtY(d.date)}</span></div>${mine.map(dRow).join('')}${spareRows(d.spareBy)}</div>`; }).join('')}
        </section>`;
  return `<div class="page">
    <a class="crumb" href="#batches">${ic('chevL')}Batches</a>
    <div class="ph">
      <div><p class="eyebrow">${b.ref}</p><h1 class="money-h">${esc(b.name)} ${batchPill(b)}</h1><p class="sub">${esc(b.from)} to Lagos, created ${fmtY(b.createdOn)}</p></div>
      <div class="acts">${primary}</div>
    </div>
    <div class="detail">
      <div class="d-main">
        <section class="sec">
          <div class="sec-h"><h2>Products <span class="n">${skus.length}</span></h2>${b.status === 'open' ? `<div class="acts"><button class="btn sm" data-act="batch-products" data-id="${b.id}">${ic('plus')}Add products</button></div>` : ''}</div>
          ${shipped ? `<div class="rtot">${rbar(got, total)}<span>Total received: ${got} of ${total} units</span></div>` : ''}
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Product</th><th class="r ph-hide">Price</th><th class="r">Preordered</th><th class="r ph-hide">Weight</th><th class="r">${shipped ? 'Received' : 'Arrives'}</th></tr></thead><tbody>
            ${skus.map(k => { const p = P(k), q = forOrders[k] || 0; return `<tr><td class="ph-wrap"><span class="who">${thumb(p, 'sm')}<span><span class="strong">${esc(p.name)}</span><small>${esc(p.variant || '')}</small></span></span></td><td class="r ph-hide">${naira(p.price)}</td><td class="r">${q}</td><td class="r ph-hide">${p.kg == null ? pill('Weight needed', 'amber') : `${p.kg * q} kg`}</td><td class="r">${shipped ? rcell(gotBy[k] || 0, q) : '<span class="faint">' + (b.eta ? fmt(b.eta) : 'Not set') + '</span>'}</td></tr>`; }).join('')}
            ${b.spareUnits ? `<tr><td class="muted ph-wrap">Spare stock to sell<small>${Object.entries(b.spareBy || {}).filter(([, n]) => n > 0).map(([k, n]) => `${esc(P(k).name)} × ${n}`).join(', ')}</small></td><td class="ph-hide"></td><td class="r">${b.spareUnits}</td><td class="r ph-hide">${b.spareKg} kg</td><td class="r">${shipped ? rcell(spareIn(b), b.spareUnits) : ''}</td></tr>` : ''}
          </tbody></table></div>
        </section>
        ${deliveriesHTML}
        <section class="sec">
          <div class="sec-h"><h2>Orders <span class="n">${os.length}</span></h2>${b.status === 'open' ? `<div class="acts"><button class="btn sm" data-act="order-in-batch" data-id="${b.id}">${ic('plus')}New order</button></div>` : ''}</div>
          ${os.length ? orderTable(os) : '<div class="tbl-empty">No orders yet. Share the batch with customers, then add their preorders here.</div>'}
        </section>
      </div>
      <aside class="d-side">
        <section class="sec">
          <div class="sec-h"><h2>Cost summary</h2>${(b.status === 'received' || b.status === 'partial') && b.ratePerKg != null ? `<button class="link" data-act="freight" data-id="${b.id}">Edit</button>` : ''}</div>
          <div class="kv">
            <span>Freight and clearing</span><span>${b.cost ? naira(b.cost) : '<span class="faint">Not added</span>'}</span>
            <span>Total weight</span><span>${kg} kg</span>
            <span>Per kg</span><span>${b.ratePerKg != null ? naira(b.ratePerKg) : '<span class="faint">Pending</span>'}</span>
          </div>
          ${['open', 'transit'].includes(b.status) ? '<p class="help">Add the cost once items start arriving. It’s split across items by weight.</p>' : ''}
          ${b.status === 'partial' && b.ratePerKg == null ? '<p class="help">Add it now, so customers whose items have arrived can see their final balance. It’s split across the whole batch by weight, including what’s still to come.</p>' : ''}
        </section>

/* ---------- Inventory (Shopify inventory: Committed, Available, On hand, Incoming; Square "20 available") ---------- */
const INV_TABS = [['in', 'In the warehouse'], ['way', 'On the way'], ['all', 'All products']];
const INV_TEST = { in: s => s.onHand > 0, way: s => s.way > 0, all: () => true };
let invQuery = '';
const stockHref = id => `#inventory/${encodeURIComponent(id)}`;
const num0 = n => n ? String(n) : '<span class="zero">0</span>';
function invRows(tab) {
  const q = invQuery.toLowerCase().trim();
  const rows = stockAll().filter(r => INV_TEST[tab](r.s) && (!q || r.p.name.toLowerCase().includes(q) || String(r.p.variant || '').toLowerCase().includes(q)))
    .sort((a, b) => b.s.onHand - a.s.onHand || b.s.way - a.s.way || a.p.name.localeCompare(b.p.name));

  return `<div class="tbl-wrap listify"><table class="tbl"><thead><tr><th>Product</th><th class="r" title="Received for a customer’s order and not yet dispatched">For customers</th><th class="r" title="Received and not tied to any order">Spare</th><th class="r" title="For customers plus spare">On hand</th><th class="r" title="Shipped by the supplier and not yet received">On the way</th><th class="r">Dispatched</th></tr></thead><tbody>
    ${rows.map(({ p, s }) => `<tr data-href="${stockHref(p.id)}"><td><span class="who">${thumb(p)}<span><a class="strong" href="${stockHref(p.id)}" style="color:inherit">${esc(p.name)}</a><small>${esc(p.variant || '')}</small></span></span></td><td class="r">${num0(s.held)}</td><td class="r">${num0(s.spare)}</td><td class="r"><span class="strong">${num0(s.onHand)}</span></td><td class="r">${num0(s.way)}</td><td class="r">${num0(s.out)}</td></tr>`).join('')}
  </tbody></table></div>
  <ul class="rowlist">${rows.map(({ p, s }) => `<li><a href="${stockHref(p.id)}">${thumb(p)}<span><strong>${esc(p.name)}</strong><small>${s.held} for customers, ${s.spare} spare${s.way ? `, ${s.way} on the way` : ''}</small></span><span class="r"><span class="num">${s.onHand}</span><small class="muted">on hand</small></span></a></li>`).join('')}</ul>`;
}
/* What changed lately across the warehouse: deliveries in, dispatches out, adjustments */
function stockActivity() {
  const ev = [];
  S.batches.forEach(b => (b.deliveries || []).forEach((d, n) => { const q = sum(batchLines(b).filter(x => x.i.dId === d.id).map(x => x.i.qty)) + (d.spare || 0);
    ev.push({ date: d.date, k: 0, qty: q, text: `Received with the ${b.name}`, sub: `Delivery ${n + 1}`, href: `#batch/${b.id}` }); }));
  S.moves.forEach(m => ev.push({ date: m.date, k: 1, qty: m.qty, text: `${P(m.sku).name}: ${lc(m.reason)}`, sub: m.note || 'Spare stock adjusted', href: stockHref(m.sku) }));
  S.dispatches.forEach(d => { const o = orderById(d.orderId); ev.push({ date: d.date, k: 2, qty: -sum(d.lines.map(l => l.qty)), text: `Dispatched to ${o ? custOf(o).name : 'a customer'}`, sub: `Order #${d.orderId}, ${dispatchHow(d)}`, href: `#order/${d.orderId}` }); });
  return ev.sort((a, b) => toMs(b.date) - toMs(a.date) || b.k - a.k);
}
const moveList = ev => `<ul class="plist">${ev.map(e => `<li><span class="d">${fmt(e.date)}</span><span>${e.href ? `<a href="${e.href}" style="color:inherit">${esc(e.text)}</a>` : esc(e.text)}<small>${esc(e.sub || '')}</small></span><span class="a ${e.qty > 0 ? '' : 'due'}">${signed(e.qty)}</span></li>`).join('')}</ul>`;
function inventoryPage(tab) {
  tab = INV_TEST[tab] ? tab : 'in';
  const all = stockAll();
  const held = sum(all.map(r => r.s.held)), spare = sum(all.map(r => r.s.spare)), way = sum(all.map(r => r.s.way));
  const out30 = -sum(stockActivity().filter(e => e.k === 2 && dayDiff(e.date) >= -30).map(e => e.qty));
  const act = stockActivity().slice(0, 8);
  return `<div class="page">
    <div class="ph"><div><h1>Inventory</h1><p class="sub">What’s in the Lagos warehouse right now. It goes up when you receive a delivery and down when an order is dispatched.</p></div></div>
    <section class="panel overview">
      <div><span class="label">On hand</span><div class="big">${plural(held + spare, 'unit')}</div><span class="muted">Across ${plural(all.filter(r => r.s.onHand > 0).length, 'product')}</span></div>
      <div class="ov-stats">
        <a href="#dispatch" title="Received for a customer’s order and not yet dispatched"><span class="label">For customers</span><strong>${held}</strong></a>
        <div title="Received and not tied to any order"><span class="label">Spare stock</span><strong>${spare}</strong></div>
        <a href="#inventory?tab=way" title="Shipped by the supplier and not yet received"><span class="label">On the way</span><strong>${way}</strong></a>
        <a href="#dispatch?tab=done" title="Units dispatched in the last 30 days"><span class="label">Dispatched</span><strong>${out30}</strong></a>
      </div>
    </section>
    <nav class="tabs" aria-label="Inventory views">${INV_TABS.map(([k, l]) => `<a href="#inventory?tab=${k}" class="${k === tab ? 'on' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${l}<span class="n">${all.filter(r => INV_TEST[k](r.s)).length}</span></a>`).join('')}</nav>
    <div class="toolbar"><div class="search-in">${ic('search')}<input id="iq" type="search" placeholder="Search products" value="${esc(invQuery)}" aria-label="Search inventory"></div></div>
    <div id="irows" data-tab="${tab}" style="margin-bottom:48px">${invRows(tab)}</div>
    <section class="sec">
      <div class="sec-h"><h2>Recent activity</h2></div>
      ${act.length ? moveList(act) : '<div class="tbl-empty">Nothing has come in or gone out yet.</div>'}
    </section>
  </div>`;
}
/* One product's stock (Shopify product page "Inventory" card and its adjustment history) */

        ${here.map(({ o, c, i }) => `<tr data-href="#order/${o.id}"><td class="strong">${esc(i.shelf || 'Not set')}</td><td><a href="#order/${o.id}" style="color:inherit">${esc(custOf(o).name)}</a><small>Order #${o.id}</small></td><td class="ph-hide muted">${fmtY(i.receivedOn)}</td><td>${c.fulfillable.includes(i) ? pill('Ready to dispatch', 'amber') : pill('On hold')}</td><td class="r">${i.qty}</td></tr>`).join('')}
        ${s.spare > 0 ? `<tr><td class="faint">None</td><td>Spare stock<small>Not tied to an order</small></td><td class="ph-hide"></td><td>${pill('Spare')}</td><td class="r">${s.spare}</td></tr>` : ''}

        ${coming.map(({ b, cust, sp }) => `<tr data-href="#batch/${b.id}"><td><a class="strong" href="#batch/${b.id}" style="color:inherit">${esc(b.name)}</a><small>${b.ref}</small></td><td>${b.eta ? fmtY(b.eta) : '<span class="faint">Not set</span>'}</td><td class="r">${num0(cust)}</td><td class="r">${num0(sp)}</td></tr>`).join('')}

/* ---------- Dispatch (Square "Shipments": To-do and Shipped; Shopify fulfillment) ---------- */
const DSP_TABS = [['todo', 'To dispatch'], ['hold', 'On hold in the warehouse'], ['done', 'Dispatched']];
let dspQuery = '';
function dispatchData() {
  const all = S.orders.map(o => ({ o, c: calc(o), cu: custOf(o) }));
  const todo = all.filter(x => x.c.fulfillable.length).sort((a, b) => toMs(a.o.created) - toMs(b.o.created));
  const hold = all.map(x => ({ ...x, its: x.c.held.filter(i => i.receivedOn) })).filter(x => x.its.length).sort((a, b) => toMs(a.o.created) - toMs(b.o.created));
  const done = [...S.dispatches].sort((a, b) => toMs(b.date) - toMs(a.date) || digits(b.id) - digits(a.id));
  return { todo, hold, done };
}
const itemsCell = its => `${its.map(i => `${esc(P(i.sku).name)} × ${i.qty}`).join('<br>')}<small>${its.some(i => i.shelf) ? `Shelf ${its.map(i => i.shelf).filter(Boolean).join(', ')}` : ''}</small>`;
const itemsLine = its => its.map(i => `${esc(P(i.sku).name)} × ${i.qty}`).join(', ');
const leavingBy = (o, cu) => !o.delivery ? '<span class="faint">Not chosen</span>' : o.delivery.method === 'pickup' ? `Pickup<small>${STORE.hub}</small>` : `Delivery<small>${esc(placeOf(cu.area))}</small>`;
function dspRows(tab) {
  const D = dispatchData();
  const ok = (o, cu) => matchOrder(o, dspQuery);
  if (tab === 'todo') {
    const rows = D.todo.filter(x => ok(x.o));
    if (!rows.length) return `<div class="tbl-empty">${D.todo.length ? 'No orders found.' : 'Nothing to dispatch right now. Orders show here once their items are in Lagos and the balance is paid.'}</div>`;
    return `<div class="tbl-wrap listify"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th>Items to pack</th><th>Leaving by</th><th class="r">Units</th><th></th></tr></thead><tbody>
      ${rows.map(({ o, c, cu }) => `<tr data-href="#order/${o.id}"><td><a class="strong" href="#order/${o.id}" style="color:inherit">#${o.id}</a><small>${fmt(o.created)}</small></td><td><span class="who">${av(cu.name)}<span>${esc(cu.name)}</span></span></td><td class="wrap">${itemsCell(c.fulfillable)}</td><td>${leavingBy(o, cu)}</td><td class="r">${sum(c.fulfillable.map(i => i.qty))}</td><td class="r"><button class="btn sm" data-act="fulfill" data-id="${o.id}">Dispatch</button></td></tr>`).join('')}
    </tbody></table></div>
    <ul class="rowlist">${rows.map(({ o, c, cu }) => `<li><a href="#order/${o.id}">${av(cu.name, 'md')}<span><strong>${esc(cu.name)}</strong><small>#${o.id}. ${itemsLine(c.fulfillable)}. Shelf ${c.fulfillable.map(i => i.shelf).filter(Boolean).join(', ')}</small></span><span class="r"><button class="btn sm" data-act="fulfill" data-id="${o.id}">Dispatch</button></span></a></li>`).join('')}</ul>`;
  }
  if (tab === 'hold') {
    const rows = D.hold.filter(x => ok(x.o));
    if (!rows.length) return `<div class="tbl-empty">${D.hold.length ? 'No orders found.' : 'Nothing is waiting in the warehouse.'}</div>`;
    const why = c => c.reasons.length ? c.reasons.map(r => esc(r.text.replace(/ \(.*\)/, ''))).join('<br>') : 'Waiting for the rest of the order';
    return `<div class="tbl-wrap listify"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th>Items in the warehouse</th><th>Why it’s waiting</th><th class="r">Units</th></tr></thead><tbody>
      ${rows.map(({ o, c, cu, its }) => `<tr data-href="#order/${o.id}"><td><a class="strong" href="#order/${o.id}" style="color:inherit">#${o.id}</a><small>${fmt(o.created)}</small></td><td><span class="who">${av(cu.name)}<span>${esc(cu.name)}</span></span></td><td class="wrap">${itemsCell(its)}</td><td class="wrap muted">${why(c)}</td><td class="r">${sum(its.map(i => i.qty))}</td></tr>`).join('')}
    </tbody></table></div>
    <ul class="rowlist">${rows.map(({ o, c, cu, its }) => `<li><a href="#order/${o.id}">${av(cu.name, 'md')}<span><strong>${esc(cu.name)}</strong><small>#${o.id}. ${itemsLine(its)}</small></span><span class="r">${pill('On hold')}<small class="muted">${plural(sum(its.map(i => i.qty)), 'unit')}</small></span></a></li>`).join('')}</ul>`;
  }
  const rows = D.done.map(d => ({ d, o: orderById(d.orderId) })).filter(x => x.o && ok(x.o));
  if (!rows.length) return `<div class="tbl-empty">${D.done.length ? 'No dispatches found.' : 'Nothing has been dispatched yet.'}</div>`;
  const how = d => d.method === 'pickup' ? `Picked up<small>${STORE.hub}</small>` : `${esc(d.carrier || 'Courier')}<small>${d.track ? `Tracking ${esc(d.track)}` : 'No tracking number'}</small>`;
  return `<div class="tbl-wrap listify"><table class="tbl"><thead><tr><th>Dispatch</th><th>Order</th><th>Customer</th><th>Items</th><th>Sent by</th><th class="r">Units</th></tr></thead><tbody>
    ${rows.map(({ d, o }) => `<tr data-href="#order/${o.id}"><td><span class="strong">${d.id}</span><small>${fmtY(d.date)}</small></td><td><a href="#order/${o.id}" style="color:inherit">#${o.id}</a></td><td><span class="who">${av(custOf(o).name)}<span>${esc(custOf(o).name)}</span></span></td><td class="wrap">${itemsCell(d.lines)}</td><td>${how(d)}</td><td class="r">${sum(d.lines.map(l => l.qty))}</td></tr>`).join('')}
  </tbody></table></div>
  <ul class="rowlist">${rows.map(({ d, o }) => `<li><a href="#order/${o.id}">${av(custOf(o).name, 'md')}<span><strong>${esc(custOf(o).name)}</strong><small>${d.id}, #${o.id}. ${itemsLine(d.lines)}</small></span><span class="r"><span class="num">${fmt(d.date)}</span><small class="muted">${d.method === 'pickup' ? 'Picked up' : esc(d.carrier || 'Courier')}</small></span></a></li>`).join('')}</ul>`;
}
function dispatchPage(tab) {

    </section>
    <nav class="tabs" aria-label="Dispatch views">${DSP_TABS.map(([k, l]) => `<a href="#dispatch?tab=${k}" class="${k === tab ? 'on' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${l}<span class="n">${n[k]}</span></a>`).join('')}</nav>
    <div class="toolbar"><div class="search-in">${ic('search')}<input id="dq" type="search" placeholder="Search by order number, customer or phone" value="${esc(dspQuery)}" aria-label="Search dispatches"></div></div>
    <div id="drows" data-tab="${tab}">${dspRows(tab)}</div>
  </div>`;
}

function customersPage() {
  const rows = S.customers.map(cu => {
    const os = S.orders.filter(o => o.customerId === cu.id);

function drawOESummary() {

function draftOrder() {
  const t = oeTotals();

    items: Object.entries(od.lines).map(([sku, qty]) => ({ sku, qty, price: P(sku).price, batchId: od.batchId, shipIncluded: od.inc, handedOver: false, released: false, shelf: null })),
    delivery: null, payments: od.collect === 'paid' && t.amt ? [{ id: 'pv', amount: t.amt, date: TODAY, method: od.method, ref: od.ref }] : [], claims: [], remindedOn: null, deliveredOn: null, log: [] };
}
function drawOEPreview() {

function createOrder() {
  const t = oeTotals(), b = batchById(od.batchId);
  if (!b.lineup) b.lineup = [];
  Object.keys(od.lines).forEach(k => { if (!b.lineup.includes(k)) b.lineup.push(k); });
  const o = draftOrder(); o.id = String(S.seq++);
  o.log = [{ date: TODAY, text: `Order placed on ${od.channel}`, kind: 'event' }];
  if (od.collect === 'paid') { o.payments = [{ id: 'p' + Date.now(), amount: t.amt, date: TODAY, method: od.method, ref: od.ref }]; o.log.push({ date: TODAY, text: `Deposit of ${naira(t.amt)} received by ${payWord(od.method)}${od.ref ? ` (${od.ref})` : ''}`, kind: 'event' }); }

}

/* ---------- Customer order status page ---------- */
function statusBody(o, { preview = false } = {}) {
  const c = calc(o), cu = custOf(o) || { name: 'there', area: 'Lekki', phone: '' };
  const bs = [...new Set(o.items.map(i => i.batchId))].map(batchById);
  const allShipped = bs.every(b => b.status !== 'open');
  const shippedOn = allShipped ? bs.map(b => b.shippedOn).sort().pop() : null;
  const arrivedOn = c.missing.length === 0 ? c.items.map(i => i.receivedOn).filter(Boolean).sort().pop() || null : null;
  const pickup = o.delivery && o.delivery.method === 'pickup';
  const steps = [
    ['Ordered', fmt(o.created), true],
    ['Shipped', shippedOn ? fmt(shippedOn) : '', !!shippedOn],
    ['Arrived in Lagos', arrivedOn ? fmt(arrivedOn) : '', !!arrivedOn || c.delivered],
    [pickup ? 'Ready for pickup' : 'Ready', '', c.ready || c.delivered],
    [pickup ? 'Picked up' : 'Delivered', c.delivered ? fmt(o.deliveredOn) : '', c.delivered],
  ];
  const doneN = steps.filter(s => s[2]).length;
  const late = c.missing.filter(i => i.b.status !== 'open').map(i => i.b.eta).filter(Boolean).sort().pop();
  let h, lead;
  if (c.delivered) { h = pickup ? 'Your order has been picked up' : 'Your order has been delivered'; lead = `Completed on ${fmtY(o.deliveredOn)}. Thank you for ordering with ${STORE.name}.`; }
  else if (c.ready) { h = pickup ? 'Your order is ready for pickup' : 'Your order is ready for delivery'; lead = pickup ? `Collect it from our ${STORE.hub}, Monday to Saturday, 10am to 6pm.` : `We’re booking a courier to ${esc(placeOf(cu.area))}. They’ll call before they arrive.`; }
  else if (!c.missing.length) { h = 'Your order has arrived in Lagos'; lead = !c.shipKnown ? 'We’re working out shipping costs. We’ll message you with your final balance.' : !o.delivery ? 'Choose pickup or delivery to see your final balance.' : 'Pay your balance and we’ll get it to you.'; }
  else if (c.items.some(i => i.here && !i.handedOver)) { h = 'Part of your order has arrived'; lead = `We’ll keep it safe in Lagos until the rest arrives${late ? `, expected ${fmtY(late)}` : ''}, so everything comes to you together.`; }
  else if (allShipped && c.missing.every(i => i.b.status === 'partial')) { h = 'Your order is on its way to Lagos'; lead = `Part of this shipment has already reached Lagos. ${c.missing.length === c.items.length ? 'Your order is' : 'Your items are'} coming in a later delivery${late ? `, expected around ${fmtY(late)}` : ''}.`; }
  else if (allShipped) { h = 'Your order is on its way to Lagos'; lead = `Expected in Lagos around ${fmtY(late)}.`; }
  else { const b = c.missing[0].b; h = 'Your order is confirmed'; lead = `We’re collecting orders until ${fmtY(b.closesOn)}, then it ships from ${esc(b.from)}. Shipping is worked out by weight when it arrives.`; }
  const needsMethod = !c.missing.length && c.shipKnown && !o.delivery && !c.delivered;
  const fee = feeFor(cu.area);
  const payBlock = c.delivered ? '' : c.claim
